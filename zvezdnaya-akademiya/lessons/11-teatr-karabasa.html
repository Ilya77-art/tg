<script>
/* Academy bridge: lets a lesson running inside «Звёздная академия» report stars per student.
   Standalone (no academy) the lesson behaves exactly as before: window.Academy.on === false. */
(function () {
  var L = 'L11';
  var embed = false;
  try { embed = !!window.ACADEMY_EMBED || /[?&]academy=1/.test(location.search); } catch (e) { embed = false; }
  if (embed && window.parent === window) embed = false;
  var roster = [], tablo = {}, subs = [];
  function post(m) { m.__academy = 1; m.lesson = L; try { window.parent.postMessage(m, '*'); } catch (e) { /* parent unreachable */ } }
  function emit() { subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener error */ } }); }
  var A = {
    on: embed,
    lesson: L,
    roster: function () { return roster; },
    tablo: function () { return tablo; },
    onRoster: function (f) { subs.push(f); },
    /* key: chapter id for 'best' (keeps the student's best result), or null for 'add' (adds up) */
    reward: function (key, n, label, mode) {
      if (!embed) return;
      n = Math.round(+n || 0); if (n <= 0) return;
      post({ type: 'reward', key: key, n: n, label: String(label || ''), mode: mode || 'best' });
    },
    points: function (id, d) {
      if (!embed) return;
      var was = tablo[id] || 0, now = Math.max(0, was + (Math.round(+d) || 0));
      if (now === was) return;
      tablo[id] = now; emit();
      post({ type: 'points', student: id, d: now - was });
    },
    addStudent: function (name) { if (embed) post({ type: 'add-student', name: String(name || '').slice(0, 40) }); },
    rename: function (id, name) { if (embed) post({ type: 'rename', student: id, name: String(name || '').slice(0, 40) }); },
    download: function (filename, data) { if (embed) post({ type: 'download', filename: filename, data: data }); },
    scores: function () {
      return {
        list: function () { return roster.map(function (s) { return { id: s.id, n: s.name, s: tablo[s.id] || 0 }; }); },
        sorted: function () { return this.list().sort(function (a, b) { return b.s - a.s; }); },
        isExample: function () { return false; },
        add: function (n) { A.addStudent(n); },
        inc: function (id, d) { A.points(id, d); },
        rename: function (id, n) { var r = roster.find(function (x) { return x.id === id; }); if (r) r.name = n; A.rename(id, n); },
        remove: function () {}, zero: function () {}, clear: function () {},
        on: function (f) { subs.push(function () { f(); }); }
      };
    }
  };
  window.Academy = A;
  if (!embed) return;
  document.documentElement.classList.add('academy');
  var st = document.createElement('style');
  st.textContent = '.academy #sc-zero,.academy #sc-clear,.academy .sc-row .x{display:none!important}.academy .sc-row{grid-template-columns:22px 1fr auto auto auto!important}';
  (document.head || document.documentElement).appendChild(st);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__academy || e.source !== window.parent) return;
    if (d.type === 'roster') { roster = Array.isArray(d.students) ? d.students : []; tablo = d.tablo || {}; emit(); }
  });
  post({ type: 'hello' });
})();
</script>
<title>Театр Карабаса</title>
<meta name="description" content="Шахматный урок на 90 минут о связке и сквозном ударе: полная и неполная связка, кукла не защищает, нос Буратино, мнимая связка и защита. Слоновья ловушка, гамбиты Стаффорда и Англунда, будапештский гамбит и ловушка Ласкера.">

<body>
<style>
/* «Театр Карабаса» — a puppet theatre: velvet curtains, a painted canvas with a hearth, a gilded board, a playbill on marionette strings */
:root {
  --wall-top: #f7ecd6;
  --wall-low: #ecd5ad;
  --floor: #b9844c;
  --floor-2: #8f5f31;
  --curtain: #a3192b;
  --curtain-2: #6e0d1b;
  --curtain-hi: #d23a45;
  --bg: #f3e6cc;
  --card: #fbf4e4;
  --card-2: #f1e3c3;
  --ink: #2b1a16;
  --muted: #6d564b;
  --line: rgba(43, 26, 22, .14);
  --line-2: rgba(43, 26, 22, .3);
  --crimson: #a3192b;
  --crimson-2: #7c1020;
  --crimson-soft: rgba(163, 25, 43, .12);
  --gold: #b8860b;
  --gold-hi: #f2c14e;
  --gold-soft: rgba(184, 134, 11, .16);
  --blue: #2f5f9e;
  --blue-soft: rgba(47, 95, 158, .14);
  --green: #3b7a35;
  --green-soft: rgba(59, 122, 53, .15);
  --plum: #6b4a8f;
  --plum-soft: rgba(107, 74, 143, .13);
  --nose: #c8732a;
  --sq-l: #f3e2c0;
  --sq-d: #b07c55;
  --frame: #c99a3c;
  --frame-2: #7d5714;
  --rampa: #3a2116;
  --rampa-2: #22130c;
  --hearth: #e8d3a8;
  --hearth-ink: #6b3f22;
  --shadow: 0 22px 40px -26px rgba(70, 20, 20, .65);
  --f-head: 'Podkova', 'Georgia', serif;
  --f-body: 'Manrope', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --bar: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --wall-top: #160b10; --wall-low: #2a1520; --floor: #3a2415; --floor-2: #24150b; --bg: #140a0f;
    --curtain: #6a0f1d; --curtain-2: #3a0710; --curtain-hi: #94202e;
    --card: #f8eedb; --card-2: #eedfbe; --ink: #2b1a16; --muted: #6d564b;
    --sq-l: #ead6b0; --sq-d: #966546; --frame: #a97f2c; --frame-2: #4f360b; --rampa: #1d100a; --rampa-2: #0f0805;
    --hearth: #3b2a22; --hearth-ink: #c99a6a;
    --shadow: 0 26px 46px -22px rgba(0, 0, 0, .9);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --wall-top: #160b10; --wall-low: #2a1520; --floor: #3a2415; --floor-2: #24150b; --bg: #140a0f;
  --curtain: #6a0f1d; --curtain-2: #3a0710; --curtain-hi: #94202e;
  --card: #f8eedb; --card-2: #eedfbe; --ink: #2b1a16; --muted: #6d564b;
  --sq-l: #ead6b0; --sq-d: #966546; --frame: #a97f2c; --frame-2: #4f360b; --rampa: #1d100a; --rampa-2: #0f0805;
  --hearth: #3b2a22; --hearth-ink: #c99a6a;
  --shadow: 0 26px 46px -22px rgba(0, 0, 0, .9);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-low) 78%, var(--floor) 78.2%, var(--floor-2) 100%) fixed, var(--bg);
}
button { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
p { margin: 0; }

/* ---------- the hall: valance, curtains, spotlights, stage floor, Papa Carlo's painted hearth ---------- */
.hall { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.damask { position: absolute; inset: 0 0 22% 0; opacity: .5;
  background-image: radial-gradient(circle at 50% 50%, rgba(163, 25, 43, .07) 0 18%, transparent 19%), radial-gradient(circle at 0 0, rgba(184, 134, 11, .08) 0 10%, transparent 11%), radial-gradient(circle at 100% 100%, rgba(184, 134, 11, .08) 0 10%, transparent 11%);
  background-size: 56px 56px; }
.spot { position: absolute; top: -10vh; width: 60vw; height: 120vh; opacity: .55; background: radial-gradient(ellipse 40% 60% at 50% 60%, rgba(255, 244, 205, .75), rgba(255, 244, 205, 0) 70%); }
.spot.l { left: -6vw; transform: rotate(-14deg); }
.spot.r { right: -6vw; transform: rotate(14deg); }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
  background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 70px, rgba(0, 0, 0, .14) 70px 72px), linear-gradient(180deg, var(--floor), var(--floor-2)); }
.floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, rgba(255, 210, 120, .0), rgba(255, 210, 120, .55) 20%, rgba(255, 210, 120, .55) 80%, rgba(255, 210, 120, 0)); filter: blur(2px); }
.curtain { position: absolute; top: 0; bottom: 0; width: clamp(34px, 6vw, 96px);
  background: repeating-linear-gradient(90deg, var(--curtain-2) 0 4px, var(--curtain) 10px 18px, var(--curtain-hi) 22px, var(--curtain) 26px 32px, var(--curtain-2) 38px 42px);
  box-shadow: inset -10px 0 18px rgba(0, 0, 0, .35); }
.curtain.l { left: 0; border-radius: 0 0 60% 0 / 0 0 16% 0; }
.curtain.r { right: 0; transform: scaleX(-1); border-radius: 0 0 60% 0 / 0 0 16% 0; }
.curtain .tie { position: absolute; left: 30%; top: 58%; width: 90%; height: 14px; border-radius: 7px; background: linear-gradient(var(--gold-hi), var(--gold)); box-shadow: 0 2px 4px rgba(0, 0, 0, .4); }
.valance { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--bar) + 40px);
  background: radial-gradient(circle at 50% 100%, transparent 0 22px, transparent 23px) 0 0 / 64px 100%, linear-gradient(180deg, var(--curtain-2), var(--curtain) 70%, var(--curtain-hi));
  -webkit-mask: radial-gradient(circle 33px at 32px 100%, transparent 98%, #000) 0 0 / 64px 100% repeat-x; mask: radial-gradient(circle 33px at 32px 100%, transparent 98%, #000) 0 0 / 64px 100% repeat-x;
  box-shadow: 0 6px 12px rgba(0, 0, 0, .25); }
.valance::after { content: ""; position: absolute; left: 0; right: 0; bottom: 34px; height: 3px; background: repeating-linear-gradient(90deg, var(--gold-hi) 0 10px, var(--gold) 10px 14px); opacity: .9; }
.hearth { position: absolute; right: 110px; bottom: 15vh; width: min(24vh, 190px); height: auto; opacity: .95; display: none; }
@media (min-width: 1760px) { .hearth { display: block; } }
.hearth .canvas { fill: var(--hearth); stroke: var(--hearth-ink); stroke-width: 2; }
.hearth .paint { fill: none; stroke: var(--hearth-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hearth .fire { fill: #e8792a; }
.hearth .fire2 { fill: #f2c14e; }
.hearth .hole { fill: #2a1208; }
.hearth .glow { fill: #ffd76a; }
.hearth .frame { fill: none; stroke: var(--frame); stroke-width: 5; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .spot { opacity: .22; }
  :root:not([data-theme="light"]) .damask { opacity: .25; }
}
:root[data-theme="dark"] .spot { opacity: .22; }
:root[data-theme="dark"] .damask { opacity: .25; }

#app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); padding: 10px clamp(16px, 6.5vw, 104px) 0; }

/* ---------- opening: the curtain rises after the third bell ---------- */
.intro { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; place-items: center; transition: opacity .6s ease .5s; }
.intro .half { position: absolute; top: 0; bottom: 0; width: 51%;
  background: repeating-linear-gradient(90deg, #5e0b18 0 6px, #a3192b 14px 26px, #d23a45 31px, #a3192b 36px 46px, #5e0b18 54px 60px);
  transition: transform 1.1s cubic-bezier(.6, 0, .3, 1); box-shadow: inset 0 -40px 60px rgba(0, 0, 0, .35); }
.intro .half.l { left: 0; }
.intro .half.r { right: 0; }
.intro .bill { position: relative; text-align: center; padding: 18px 34px 16px; border-radius: 12px; color: var(--crimson-2); background: #fbf2dc; border: 4px double var(--gold); box-shadow: 0 20px 40px -14px rgba(0, 0, 0, .6); font-family: var(--f-head); font-weight: 800; font-size: clamp(34px, 6.4vw, 76px); line-height: 1; transition: opacity .35s, transform .35s; }
.intro .bill small { display: block; font-family: var(--f-body); font-weight: 800; font-size: .21em; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: .5em; }
.intro.open .half.l { transform: translateX(-100%); }
.intro.open .half.r { transform: translateX(100%); }
.intro.open .bill { opacity: 0; transform: translateY(-30px); }
.intro.open { opacity: 0; }
.intro.gone { display: none; }

/* ---------- header on the valance ---------- */
.bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; color: #fbecd0; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { width: 46px; height: 46px; flex: none; overflow: visible; }
.logo .key { transform-origin: 24px 4px; animation: swing 3.2s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.logo b { font-family: var(--f-head); font-weight: 800; font-size: 26px; letter-spacing: .01em; line-height: 1; color: #fff3da; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.logo span { display: block; font-size: 13px; color: var(--gold-hi); letter-spacing: .05em; font-weight: 800; text-transform: uppercase; margin-top: 3px; text-shadow: 0 1px 2px rgba(40, 0, 8, .6); }
.tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; align-items: center; padding: 4px 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; }
.tabs > :last-child { margin-right: auto; }
.tabs button { flex: none; height: 38px; min-width: 38px; border: 1.5px solid rgba(251, 236, 208, .45); background: rgba(40, 6, 12, .3); border-radius: 19px; padding: 0 12px; cursor: pointer; font-family: var(--f-head); font-weight: 800; font-size: 17px; color: #fbecd0; display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.tabs button .tl { font-family: var(--f-body); font-weight: 800; font-size: 14px; display: none; }
.tabs button .lv { display: inline-flex; gap: 2px; }
.tabs button .lv i { width: 7px; height: 7px; border-radius: 1px; transform: rotate(45deg); background: rgba(251, 236, 208, .3); }
.tabs button .lv i.on { background: var(--gold-hi); box-shadow: 0 0 0 1px rgba(90, 50, 0, .35); }
.tabs button:hover { border-color: var(--gold-hi); color: #fff; }
.tabs button[aria-current="true"] { background: #fbf2dc; color: var(--crimson-2); border-color: var(--gold-hi); box-shadow: 0 0 0 3px rgba(242, 193, 78, .5); }
.tabs button[aria-current="true"] .tl { display: inline; }
.tabs button[aria-current="true"] .lv i { background: rgba(124, 16, 32, .25); }
.tabs button[aria-current="true"] .lv i.on { background: var(--gold); }
.tools { display: flex; align-items: center; gap: 8px; }
.stars { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; padding: 5px 12px 5px 8px; border: 1.5px solid rgba(251, 236, 208, .45); border-radius: 18px; white-space: nowrap; color: #fbecd0; background: rgba(40, 6, 12, .3); }
.stars svg { width: 22px; height: 22px; color: var(--gold-hi); filter: drop-shadow(0 1px 0 rgba(90, 50, 0, .5)); }
.stars b { font-family: var(--f-head); font-weight: 800; font-size: 20px; color: #fff3da; }
.stars.bump svg { animation: spin .7s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes spin { from { transform: rotate(-180deg) scale(.4); } to { transform: none; } }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(251, 236, 208, .45); background: rgba(40, 6, 12, .3); cursor: pointer; display: grid; place-items: center; color: #fbecd0; }
.icon-btn:hover { color: #fff; border-color: var(--gold-hi); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="false"] { opacity: .5; }

/* ---------- stage ---------- */
.stage { --bs: min(calc(100vh - var(--bar) - 110px), 50vw, 640px); display: grid; grid-template-columns: var(--bs) minmax(300px, 460px); justify-content: center; align-items: center; gap: 34px; padding-block: 26px 22px; min-height: 0; position: relative; }
.board-col { width: var(--bs); display: flex; flex-direction: column; gap: 12px; }
.board-frame { width: 100%; aspect-ratio: 1; padding: 20px; position: relative; border-radius: 8px; box-shadow: var(--shadow), inset 0 0 0 3px rgba(255, 236, 170, .55), inset 0 0 0 7px rgba(90, 60, 10, .35), inset 0 -6px 12px rgba(0, 0, 0, .3);
  background:
    repeating-linear-gradient(45deg, rgba(255, 240, 190, .12) 0 2px, transparent 2px 9px),
    linear-gradient(150deg, #f6d77e, var(--frame) 30%, var(--frame-2) 55%, var(--frame) 80%, #f0cf72); }
.board-frame .nail { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff3c4, #d9a83b 45%, #7d5714 75%); box-shadow: 0 0 0 2px rgba(125, 87, 20, .5), 0 1px 1px rgba(0, 0, 0, .5); }
.board-frame .nail.a { left: 4px; top: 4px; } .board-frame .nail.b { right: 4px; top: 4px; } .board-frame .nail.c { left: 4px; bottom: 4px; } .board-frame .nail.d { right: 4px; bottom: 4px; }
.board { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; background: var(--sq-l); border-radius: 2px; box-shadow: 0 0 0 2px rgba(60, 30, 0, .45); }
.sq { position: relative; display: grid; place-items: center; }
.sq.l { background: var(--sq-l); }
.sq.d { background: var(--sq-d); background-image: linear-gradient(100deg, rgba(255, 255, 255, .05), rgba(0, 0, 0, .04) 60%, rgba(255, 255, 255, .03)); }
.board.clicky .sq { cursor: pointer; }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq[data-mark]:not([data-mark=""])::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(242, 193, 78, .42); }
.sq.sel::before { background: rgba(47, 95, 158, .36); }
.sq.check::before { background: radial-gradient(circle, rgba(214, 40, 30, .85), rgba(214, 40, 30, 0) 72%); }
.sq[data-mark="puppeteer"]::before { box-shadow: inset 0 0 0 4px var(--crimson); background: var(--crimson-soft); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="doll"]::before { box-shadow: inset 0 0 0 4px var(--blue); background: var(--blue-soft); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="treasure"]::before { box-shadow: inset 0 0 0 4px var(--gold-hi); background: radial-gradient(circle, transparent 30%, rgba(242, 193, 78, .45) 31% 36%, transparent 37%), rgba(242, 193, 78, .25); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="pick"]::before { box-shadow: inset 0 0 0 4px var(--plum); background: var(--plum-soft); animation: markin .3s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="right"]::before { box-shadow: inset 0 0 0 4px var(--green); background: var(--green-soft); }
.sq[data-mark="wrong"]::before { box-shadow: inset 0 0 0 4px #d12a1e; background: rgba(209, 42, 30, .18); }
.sq[data-mark="missed"]::before { box-shadow: inset 0 0 0 4px var(--green); background: repeating-linear-gradient(45deg, rgba(59, 122, 53, .22) 0 5px, transparent 5px 10px); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes markin { from { transform: scale(1.5); opacity: 0; } }
@keyframes pulse { to { box-shadow: inset 0 0 0 7px var(--green); } }
.sq.dot::after { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: rgba(43, 26, 22, .38); pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(43, 26, 22, .38); pointer-events: none; }
.co { position: absolute; font-size: clamp(9px, 1.15vmin, 12px); line-height: 1; pointer-events: none; z-index: 1; font-weight: 800; }
.sq.l .co { color: #96643f; }
.sq.d .co { color: #f6e8c8; }
.co-r { top: 3px; left: 3px; }
.co-f { bottom: 2px; right: 3px; }
.pc { width: 90%; height: 90%; position: relative; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 1px rgba(40, 10, 5, .25)); }
.pc.anim { transition: transform .24s cubic-bezier(.3, .7, .4, 1); }
.pc.lift { opacity: .3; }
.pc.pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); }

/* the overlay: strings of pins and Buratino's nose */
.board .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.ov .thread { fill: none; stroke: var(--gold-hi); stroke-width: .06; stroke-linecap: round; filter: drop-shadow(0 0 .04px #fff); animation: threadin .45s ease-out; }
.ov .thread.abs { stroke: #ff5b4a; }

    ['q', 'r', 'b', 'n'].forEach(t => {
      const btn = document.createElement('button'); btn.type = 'button';
      btn.title = names[t]; btn.setAttribute('aria-label', names[t]);

  }
  // plays a move (from/to/promotion or SAN) with sound, petals on a capture, a pluck for a new pin and the nose for a skewer
  play(mv) {
    const m = this.pos.findMove(mv); if (!m) return null;
    const san = this.pos.san(m);
    const mover = this.pos.turn, before = new Set(pinsOf(this.pos).map(x => x.s + ':' + x.p));
    this.pos.make(m);
    const fresh = pinsOf(this.pos).filter(x => colorOf(this.pos.board[x.s]) === mover && !before.has(x.s + ':' + x.p));
    const sk = this.pos.status() === 'mate' ? null : skewerOf(this.pos);
    if (sk) NOSE = Object.assign(sk, { c: mover });
    else if (NOSE && NOSE.c === mover) NOSE = null; // the skewering side moved on: took the prize or let it go

    if (fresh.length && SHOW_THREADS) setTimeout(() => Sound.pluck(), 90);
    if (sk) setTimeout(() => Sound.nose(), 120);
    this.set(this.pos, { last: { from: m.from, to: m.to }, anim: m });
    return { m, san };
  }
}

function tape(sans, startFen) {
  const el = $('#tapeMoves'); if (!sans.length) { el.innerHTML = ''; return; }
  const p = new Position(startFen); let n = p.full, t = p.turn; const out = [];

  el.innerHTML = out.slice(-8).join('');
}
const fenAfter = (fen, sans) => { const p = new Position(fen); sans.forEach(s => { const m = p.findMove(s); if (!m) throw new Error('bad move ' + s); p.make(m); }); return p.fen(); };
const keyOf = p => p.fen().split(' ').slice(0, 3).join(' ');

/* the last moves of an opening on the footlights before a trap */
function openingTape(k) { const t = D.traps[k], a = Math.max(0, t.at - 6); tape(t.moves.slice(a, t.at), fenAfter(D.start, t.moves.slice(0, a))); }
const opening = (k, marks) => { const t = D.traps[k]; const p = new Position(D.start); let s = ''; t.moves.slice(0, t.at).forEach((m, i) => { const r = p.play(m); s += (i % 2 === 0 ? `${i / 2 + 1}.` : ' ') + ru(r.san) + ((marks || {})[i] || '') + (i % 2 ? ' ' : ''); }); return esc(s.trim()); };

function demoLine(fen, sans, cb, opts) {

  const shown = []; tape(shown, fen);
  const my = ++demoGen; let k = 0;
  const step = () => {

/* ---------- verified move-graph player: the student moves, the computer replies ---------- */
function makeGraph(o) {
  // o: { task:{fen, side, G}, onDone(kind, stats), onStep(k, san, pos), onReply(k, san, pos), badText(san, refSan, u), eqText(san), wText(san), showRef: 'play' | 'arrow', limitSeal }
  const T = o.task, G = T.G;
  let pos, sans, busy, over, gen = 0, k; let mistakes = 0, hints = 0;
  const showTape = () => tape(sans, T.fen);
  function reset() {
    gen++; demoGen++;
    pos = new Position(T.fen); sans = []; busy = false; over = false; k = 0; NOSE = null;
    board.setOrient(T.side); board.set(pos); board.arrows = []; board.render(); showTape(); clearSeal();
    if (o.onReset) o.onReset(pos);
  }
  reset();
  function done(kind) {
    over = true;
    if (kind === 'mate') seal('Мат!', '', o.mateSmall || 'занавес');
    else if (o.limitSeal) seal(o.limitSeal[0], o.limitSeal[1] || 'green', o.limitSeal[2]);
    flash($('#frame'), 'ok'); Sound.bravo(); Petals.burst(0.35);
    o.onDone(kind, { mistakes, hints, sans });
  }
  board.canMove = () => !busy && !over && pos.turn === T.side;
  board.onMove = mv => {
    const prev = pos.fen(), key = keyOf(pos), nd = G[key];
    const r = board.play(mv); if (!r) return;
    const u = uciOf(r.m);
    if (nd && u in nd.g) {
      sans.push(r.san); showTape(); board.arrows = []; board.marks = {}; board.render(); Sound.ok(); k++;
      if (o.onStep) o.onStep(k, r.san, pos);
      const st = pos.status();
      if (st === 'mate' || st === 'stalemate') { done(st); return; }
      const rep = nd.g[u];
      if (!rep) { done('limit'); return; }
      busy = true; const g0 = gen;
      later(() => {
        if (g0 !== gen) return;
        const rr = board.play(sqFromU(rep)); sans.push(rr.san); showTape(); busy = false;
        if (o.onReply) o.onReply(k, rr.san, pos);
        const st2 = pos.status();
        if (st2 === 'mate' || st2 === 'stalemate') { done(st2); return; }
        if (!G[keyOf(pos)]) done('limit');
      }, 760);
      return;
    }
    busy = true; const g1 = gen;
    const back = ms => later(() => { if (g1 !== gen) return; pos = new Position(prev); NOSE = null; board.set(pos); board.arrows = []; board.marks = {}; board.render(); clearSeal(); busy = false; }, ms);
    if (nd && nd.e.includes(u)) { Sound.tick(); say('warn', o.eqText ? o.eqText(r.san) : `${RUP(r.san)} — тоже неплохо, но ищем другой ход.`); back(1900); return; }
    if (nd && nd.w && nd.w.includes(u)) { Sound.tick(); say('warn', o.wText ? o.wText(r.san) : `${RUP(r.san)} — сильный ход, но есть ещё сильнее. Ищите!`); back(1900); return; }
    mistakes++; Sound.bad(); flash($('#frame'), 'bad');
    const ref = nd && nd.b[u]; let refSan = '';
    if (ref) {
      const m2 = pos.findMove(sqFromU(ref));
      if (m2) {
        refSan = pos.san(m2);
        if (o.showRef === 'play') later(() => { if (g1 === gen && !over) board.play(sqFromU(ref)); }, 700);
        else { board.arrows = [{ from: m2.from, to: m2.to, color: 'var(--crimson)' }]; board.render(); }
      }
    }
    say('bad', o.badText ? o.badText(r.san, refSan, u) : `${RUP(r.san)}? ${refSan ? `Ответ <b>${RUP(refSan)}</b> — и спектакль не задался.` : 'Так не выйдет.'}`);
    back(o.showRef === 'play' ? 3000 : 2200);
  };
  return {
    reset,
    hint() {
      if (busy || over) return false; const nd = G[keyOf(pos)]; if (!nd) return false;
      const u = Object.keys(nd.g)[0]; if (!u) return false;
      hints++; board.arrows = [{ from: sqIndex(u.slice(0, 2)), to: sqIndex(u.slice(2, 4)), color: 'var(--plum)' }]; board.render(); Sound.reveal(); return true;
    },
    stats: () => ({ mistakes, hints }),
    pos: () => pos
  };
}

/* shared: a chapter of rounds; a round is a graph task */
function roundsChapter(ch, rounds, cfg) {
  let i, res, errs, L;
  function next() {
    const last = i === rounds.length - 1;
    ctl(Bt('nx', last ? 'Итог главы →' : 'Следующая задача →', 'primary'));
    on('nx', () => { clearSeal(); if (last) finish(); else { i++; show(); } });
  }
  function show() {
    const r = rounds[i];
    card.innerHTML = head(cfg.kicker, pips(rounds.length, i, res), r.title, r.text) +
      (r.extra || '') + `<div class="fb" id="fb"></div><div class="controls" id="ctl"></div>` + (r.fact ? factHtml(r.fact[0], r.fact[1], r.fact[2]) : '');
    ctl(Bt('hintB', 'Подсказка', 'hint') + Bt('rsB', 'Заново'));
    on('hintB', () => { if (L.hint()) say('warn', cfg.hintText || 'Стрелка показывает нужный ход.'); });
    on('rsB', () => { L.reset(); say(); });
    L = makeGraph(Object.assign({ showRef: cfg.showRef, eqText: cfg.eqText, wText: cfg.wText, badText: cfg.badText }, r.opts || {}, {
      task: r.task,
      onStep(k, san, pos) { const t = r.steps && r.steps[k - 1]; if (t) say('ok', typeof t === 'function' ? t(san) : t); else say(); },
      onDone(kind, st) {
        const e = st.mistakes + st.hints; errs += e; res[i] = e === 0;
        card.querySelector('.kicker b').innerHTML = pips(rounds.length, i, res);
        const d = r.done || {};
        say('ok', typeof d === 'function' ? d(kind, st) : (d[kind] || d.any || 'Браво!'));
        next();
      }
    }));
  }
  function finish() { card.innerHTML = head(cfg.kicker, '', cfg.doneTitle, '') + finishCard(ch, scoreBy(errs), cfg.doneLine); }
  return { enter() { i = 0; res = []; errs = 0; if (cfg.before) cfg.before(e => { errs = e; show(); }); else show(); } };
}

  h6: 'h6! Спросите кукловода: слону g5 придётся решать, куда уйти.', Qe8: 'Фe8! Ферзь ушёл из-за спины коня — связки больше нет.', Qd7: 'Фd7! Ферзь ушёл из-за спины коня — связки больше нет.',
  e6: 'e6! Пешка стережёт d5 — ход d5 не пройдёт.', Bd7: 'Сd7! Слон закрыл линию — кукла отвязана.'
};
IMPL[6] = roundsChapter(6, [
  { title: 'Ферзь в опасности', task: D.g.e1,
    text: 'Ход чёрных. Позиция из главы 1, но теперь ходите вы! Белые грозят Сb5 — привязать ферзя к королю. Разрежьте нитку заранее!',
    done: (kind, st) => CUT[st.sans[0].replace(/[+#]/g, '')] || 'Нитка разрезана!' },
  { title: 'Конь на нитке', task: D.g.e2,
    text: 'Ход чёрных. Позиция из главы 2: белые грозят e5, и конь f6 погибнет. Что делать?',
    done: (kind, st) => CUT[st.sans[0].replace(/[+#]/g, '')] || 'Нитка разрезана!' },
  { title: 'Спасите коня', task: D.g.e3,
    text: 'Ход чёрных. Позиция из главы 1: конь c6 привязан к королю, и белые грозят d5. Как спасти куклу?',
    done: (kind, st) => CUT[st.sans[0].replace(/[+#]/g, '')] || 'Нитка разрезана!' }
], { kicker: 'Глава 6 · ножницы', doneTitle: 'Нитки разрезаны', showRef: 'play',
  badText: (san, ref) => `${RUP(san)}? ${ref ? `Ответ <b>${RUP(ref)}</b> — и связка срабатывает.` : 'Так не спастись.'}`,
  doneLine: 'Четыре ножницы против связки: уведите короля или ферзя с линии, закройтесь, прогоните кукловода пешкой — или не пускайте его на нужное поле заранее.' });

/* 7 — the playbill: opening traps */
IMPL[7] = roundsChapter(7, [
  { title: 'Гамбит Англунда', task: D.g.t1,
    text: `Гамбит Англунда: ${opening('englund', { 10: '?' })} Ход чёрных. Белые напали на ферзя b2. Привяжите слона c3 к королю!`,
    steps: ['Сb4! Слон c3 на нитке: за ним король e1, а нападают на него двое.', 'С:c3 — белым приходится брать ферзём.', 'Фc1# — мат!'],
    done: { mate: 'Мат на восьмом ходу! Гамбит назван в честь шведского шахматиста Фрица Англунда.' },
    opts: { onReset() { openingTape('englund'); } } },
  { title: 'Будапештский гамбит', task: D.g.t2,
    text: `Будапештский гамбит: ${opening('budapest', { 14: '??' })} Ход чёрных. Белые выиграли слона. <b>Мат в 1 ход!</b>`,
    done: { mate: 'Кd3# — пешка e2 не может взять коня: её привязал ферзь e7. Одна из самых известных ловушек будапештского гамбита.' },
    opts: { onReset() { openingTape('budapest'); } } },
  { title: 'Ловушка Ласкера', task: D.g.t3,
    text: `Контргамбит Альбина: ${opening('lasker', { 6: '?', 10: '??' })} Ход чёрных. Пешка f2 рвётся в ферзи — но в какую фигуру превратиться?`,
    steps: ['f:g1=К+!! Превращение в коня — с шахом!', 'Сg4+ — нос Буратино: король уйдёт, и ферзь d1 пропадёт.'],
    done: { any: 'Ловушка названа в честь Эмануила Ласкера. Превращение в коня уже на седьмом ходу! А на 8.Крe1 сильно 8…Фh4+.' },
    opts: { limitSeal: ['Аншлаг!', 'gold', 'ферзь пропадает'], onReset() { openingTape('lasker'); },
      badText: (san, ref) => /=Q/.test(san) ? `${RUP(san)}? Новый ферзь не даёт шаха, и белые успевают ответить <b>${RUP(ref)}</b>. Превратитесь с шахом!` : `${RUP(san)} — не то. ${ref ? `Ответ <b>${RUP(ref)}</b>. ` : ''}Подумайте о превращении!` } }
], { kicker: 'Глава 7 · афиша ловушек', doneTitle: 'Аншлаг!',
  badText: (san, ref) => `${RUP(san)} — не то. ${ref ? `Ответ <b>${RUP(ref)}</b>. ` : ''}Ищите нитку к королю!`,
  doneLine: 'Связка в дебюте ловит даже опытных: слон, конь или пешка оказываются привязаны к королю — и спектакль заканчивается в первом акте.' });

/* ★ — the golden key: summary */
IMPL[8] = (() => {
  const RANKS = [[19, 'Хранитель золотого ключика'], [14, 'Главный кукловод'], [8, 'Артист театра'], [0, 'Зритель первого ряда']];
  const DESC = { 'Хранитель золотого ключика': 'знает тайну потайной дверцы', 'Главный кукловод': 'держит все нитки в руках', 'Артист театра': 'связку видит издалека', 'Зритель первого ряда': 'всё ещё впереди' };
  return {
    enter() {
      const n = totalS(), rank = RANKS.find(r => n >= r[0])[1];
      board.set(new Position(D.pro.fen)); board.render();
      card.innerHTML = head('Золотой ключик', `${n} из ${MAXS}`, rank, `${DESC[rank][0].toUpperCase() + DESC[rank].slice(1)}.`) +
        `<div class="finale">${MINIKEY}<div class="starrow">${[0, 1, 2].map(k => starSvg(k < Math.round(n / MAXS * 3) ? '' : 'off')).join('')}</div></div>
        <ul class="recap">
          <li><i>✚</i><span><b>Связка</b> — кукловод, кукла и сокровище на одной линии.</span></li>
          <li><i>♚</i><span><b>Полная связка</b> — за куклой король: ходить ей запрещено.</span></li>
          <li><i>♛</i><span><b>Неполная</b> — за куклой ферзь или ладья: ходить можно, но дорого.</span></li>
          <li><i>♙</i><span><b>Бей по кукле</b> пешкой. Кукла — плохой защитник.</span></li>
          <li><i>➶</i><span><b>Сквозной удар</b> — нос Буратино: ценная впереди, добыча сзади.</span></li>
          <li><i>✂</i><span><b>Ножницы</b>: уйти с линии, закрыться, прогнать кукловода. И помните о мнимых связках!</span></li>
        </ul>
        <p class="kicker"><span>Домашнее задание</span></p>
        <div class="links">
          <a href="https://lichess.org/training/pin" target="_blank" rel="noopener">Задачи «Связка» на Lichess <span>решите 10 задач</span></a>
          <a href="https://lichess.org/training/skewer" target="_blank" rel="noopener">Задачи «Сквозной удар» на Lichess <span>решите 5 задач</span></a>
          <button type="button" id="pgnB">Скачать PGN урока <span>Lichess → Исследование → Импорт PGN</span></button>
          <button type="button" id="pgnC">Скопировать PGN <span>и вставить в Lichess</span></button>
        </div>
        <div class="fb" id="fb"></div>
        <div class="controls"><button type="button" class="btn" id="resetAll">Сбросить звёзды</button></div>`;
      Sound.bravo(); later(() => Petals.burst(1.2), 400);
      const PGN = window.TEATR_PGN, FILE = 'teatr-karabasa-lichess';
      const blobSave = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([PGN], { type: 'application/x-chess-pgn' })); a.download = FILE + '.pgn'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) { say('warn', 'Скачивание недоступно — скопируйте PGN кнопкой ниже.'); } };
      on('pgnB', async () => {
        if (window.Academy && Academy.on) { Academy.download(FILE + '.txt', PGN); say('ok', 'Академия предложит сохранить файл. В Lichess: Исследование → Импорт PGN.'); return; }
        const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (!dl) { blobSave(); return; }
        try { await dl.save({ filename: FILE + '.txt', data: PGN }); say('ok', 'Файл сохранён. В Lichess: Исследование → Импорт PGN → вставьте текст из файла.'); }
        catch (e) { if (e && e.code === 'declined') say(); else say('warn', 'Скачивание недоступно здесь — скопируйте PGN кнопкой ниже.'); }
      });
      on('pgnC', async () => {
        try { await navigator.clipboard.writeText(PGN); say('ok', 'PGN скопирован. В Lichess: Исследование → Импорт PGN → вставьте.'); }
        catch (e) { say('warn', 'Браузер не дал скопировать. Используйте кнопку «Скачать PGN».'); }
      });
      twoStep($('#resetAll'), 'Точно сбросить?', () => { state = { v: 1, ch: 8, st: {} }; save(); go(8); });
    }
  };
})();

/* ---------- start ---------- */
renderTabs();
go(Math.min(CH.length - 1, Math.max(0, state.ch || 0)));
(function intro() {
  const c = $('#intro'); if (!c) return;
  if (reduceMotion) { c.classList.add('gone'); return; }
  setTimeout(() => Sound.bell(), 150);
  setTimeout(() => { c.classList.add('open'); Sound.curtain(); }, 1300);
  setTimeout(() => c.classList.add('gone'), 2500);
})();
})();
</script>
