<script>
/* Academy bridge: lets a lesson running inside «Звёздная академия» report stars per student.
   Standalone (no academy) the lesson behaves exactly as before: window.Academy.on === false. */
(function () {
  var L = 'L07';
  var embed = false;
  try { embed = !!window.ACADEMY_EMBED || /[?&]academy=1/.test(location.search); } catch (e) { embed = false; }
  if (embed && window.parent === window) embed = false;
  var roster = [], tablo = {}, subs = [];
  function post(m) { m.__academy = 1; m.lesson = L; try { window.parent.postMessage(m, '*'); } catch (e) { /* parent unreachable */ } }
  function emit() { subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener error */ } }); }
  var A = {
    on: embed,
    lesson: L,
    roster: function () { return roster; },
    tablo: function () { return tablo; },
    onRoster: function (f) { subs.push(f); },
    /* key: chapter id for 'best' (keeps the student's best result), or null for 'add' (adds up) */
    reward: function (key, n, label, mode) {
      if (!embed) return;
      n = Math.round(+n || 0); if (n <= 0) return;
      post({ type: 'reward', key: key, n: n, label: String(label || ''), mode: mode || 'best' });
    },
    points: function (id, d) {
      if (!embed) return;
      var was = tablo[id] || 0, now = Math.max(0, was + (Math.round(+d) || 0));
      if (now === was) return;
      tablo[id] = now; emit();
      post({ type: 'points', student: id, d: now - was });
    },
    addStudent: function (name) { if (embed) post({ type: 'add-student', name: String(name || '').slice(0, 40) }); },
    rename: function (id, name) { if (embed) post({ type: 'rename', student: id, name: String(name || '').slice(0, 40) }); },
    download: function (filename, data) { if (embed) post({ type: 'download', filename: filename, data: data }); },
    scores: function () {
      return {
        list: function () { return roster.map(function (s) { return { id: s.id, n: s.name, s: tablo[s.id] || 0 }; }); },
        sorted: function () { return this.list().sort(function (a, b) { return b.s - a.s; }); },
        isExample: function () { return false; },
        add: function (n) { A.addStudent(n); },
        inc: function (id, d) { A.points(id, d); },
        rename: function (id, n) { var r = roster.find(function (x) { return x.id === id; }); if (r) r.name = n; A.rename(id, n); },
        remove: function () {}, zero: function () {}, clear: function () {},
        on: function (f) { subs.push(function () { f(); }); }
      };
    }
  };
  window.Academy = A;
  if (!embed) return;
  document.documentElement.classList.add('academy');
  var st = document.createElement('style');
  st.textContent = '.academy #sc-zero,.academy #sc-clear,.academy .sc-row .x{display:none!important}.academy .sc-row{grid-template-columns:22px 1fr auto auto auto!important}';
  (document.head || document.documentElement).appendChild(st);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__academy || e.source !== window.parent) return;
    if (d.type === 'roster') { roster = Array.isArray(d.students) ? d.students : []; tablo = d.tablo || {}; emit(); }
  });
  post({ type: 'hello' });
})();
</script>

<body>
<style>
/* «Шифр Ласкера» — cipher bureau dossier, 1901: aged paper, typewriter ink, red stamps */
:root {
  --paper: #efe7d3;
  --paper-2: #e5dbc2;
  --card: #f8f2e3;
  --ink: #1f1d1a;
  --muted: #625b4c;
  --line: rgba(31, 29, 26, .16);
  --line-2: rgba(31, 29, 26, .3);
  --stamp: #b3342b;
  --stamp-soft: rgba(179, 52, 43, .14);
  --ribbon: #26457d;
  --ribbon-soft: rgba(38, 69, 125, .14);
  --ok: #2f6b3a;
  --ok-soft: rgba(47, 107, 58, .16);
  --sq-l: #f3ecd9;
  --hatch: rgba(31, 29, 26, .55);
  --frame: #1f1d1a;
  --shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 16px 30px -22px rgba(40, 30, 10, .55);
  --f-mono: 'PT Mono', 'Courier New', monospace;
  --f-serif: 'PT Serif', 'Georgia', serif;
  --f-stamp: 'Rubik Mono One', 'Arial Black', sans-serif;
  --bar: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15171b; --paper-2: #1b1e24; --card: #20242b; --ink: #ece4d2; --muted: #a59d8b;
    --line: rgba(236, 228, 210, .12); --line-2: rgba(236, 228, 210, .26);
    --stamp: #ff6f5f; --stamp-soft: rgba(255, 111, 95, .16); --ribbon: #93b2ff; --ribbon-soft: rgba(147, 178, 255, .16);
    --ok: #7fd08e; --ok-soft: rgba(127, 208, 142, .16);
    --sq-l: #ddd4bd; --hatch: rgba(30, 28, 24, .62); --frame: #0b0c0e;
    --shadow: 0 16px 30px -18px rgba(0, 0, 0, .8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15171b; --paper-2: #1b1e24; --card: #20242b; --ink: #ece4d2; --muted: #a59d8b;
  --line: rgba(236, 228, 210, .12); --line-2: rgba(236, 228, 210, .26);
  --stamp: #ff6f5f; --stamp-soft: rgba(255, 111, 95, .16); --ribbon: #93b2ff; --ribbon-soft: rgba(147, 178, 255, .16);
  --ok: #7fd08e; --ok-soft: rgba(127, 208, 142, .16);
  --sq-l: #ddd4bd; --hatch: rgba(30, 28, 24, .62); --frame: #0b0c0e;
  --shadow: 0 16px 30px -18px rgba(0, 0, 0, .8);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(120% 80% at 10% 0%, rgba(255, 255, 255, .25), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 31px, var(--line) 31px 32px),
    var(--paper);
  color: var(--ink); font-family: var(--f-serif); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--ribbon); }
:focus-visible { outline: 2px solid var(--ribbon); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
#app { min-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); padding-inline: 16px; }

/* ---------- top bar: case file tabs ---------- */
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 16px; border-bottom: 2px solid var(--ink); }
.case { align-self: center; display: flex; align-items: baseline; gap: 10px; }
.case b { font-family: var(--f-stamp); font-size: 15px; letter-spacing: .04em; color: var(--stamp); border: 2px solid var(--stamp); padding: 3px 8px 1px; transform: rotate(-2deg); display: inline-block; }
.case span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; align-items: flex-end; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; }
.tabs > :last-child { margin-right: auto; }
.tabs button { flex: none; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--paper-2); padding: 6px 11px 5px; cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabs button .no { font-weight: 700; color: var(--ink); }
.tabs button .sl { color: var(--stamp); font-size: 11px; letter-spacing: -1px; }
.tabs button.ic { background: var(--ribbon-soft); }
.tabs button:not([aria-current="true"]) .tl { display: none; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="true"] { background: var(--card); color: var(--ink); border-color: var(--ink); box-shadow: 0 2px 0 var(--card); position: relative; z-index: 1; }
.tools { align-self: center; display: flex; align-items: center; gap: 8px; }
.seals { font-family: var(--f-mono); font-size: 13px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--card); white-space: nowrap; }
.seals b { color: var(--stamp); }
.icon-btn { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--card); cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

/* ---------- stage ---------- */
.stage { --bs: min(calc(100vh - var(--bar) - 96px), 54vw, 640px); display: grid; grid-template-columns: var(--bs) minmax(300px, 440px); justify-content: center; align-items: center; gap: 30px; padding-block: 18px; min-height: 0; }
.board-col { width: var(--bs); display: flex; flex-direction: column; gap: 10px; }
.board-frame { width: 100%; aspect-ratio: 1; padding: 4px; background: var(--frame); position: relative; box-shadow: var(--shadow); }
.board { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; background: var(--sq-l); }
.sq { position: relative; display: grid; place-items: center; }
.sq.l { background: var(--sq-l); }
.sq.d { background: repeating-linear-gradient(135deg, var(--hatch) 0 1.3px, transparent 1.3px 5px), var(--sq-l); }
.board.clicky .sq { cursor: pointer; }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq[data-mark]:not([data-mark=""])::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(38, 69, 125, .2); box-shadow: inset 0 0 0 2px rgba(38, 69, 125, .55); }
.sq.sel::before { background: rgba(38, 69, 125, .3); }
.sq[data-mark="zone"]::before { background: rgba(179, 52, 43, .1); }
.sq[data-mark="pick"]::before { box-shadow: inset 0 0 0 4px var(--ribbon); }
.sq[data-mark="ok"]::before { background: rgba(47, 107, 58, .3); box-shadow: inset 0 0 0 4px var(--ok); }
.sq[data-mark="bad"]::before { box-shadow: inset 0 0 0 4px var(--stamp); background: rgba(179, 52, 43, .18); }
.sq[data-mark="target"]::before { box-shadow: inset 0 0 0 3px var(--stamp); border-radius: 50%; inset: 8%; }
.sq.dot::after { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: rgba(38, 69, 125, .55); pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(38, 69, 125, .5); pointer-events: none; }
.co { position: absolute; font-family: var(--f-mono); font-size: clamp(8px, 1.1vmin, 11px); line-height: 1; pointer-events: none; z-index: 1; color: #6f6656; background: var(--sq-l); padding: 0 1px; }
.co-r { top: 2px; left: 2px; }
.co-f { bottom: 2px; right: 2px; }
.pc { width: 90%; height: 90%; position: relative; z-index: 2; pointer-events: none; }
.pc.anim { transition: transform .22s cubic-bezier(.3, .7, .4, 1); }
.pc.lift { opacity: .3; }
.pc.pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); }
.board .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.board-frame.flash-bad { animation: fbad .6s; }
@keyframes fbad { 30% { box-shadow: 0 0 0 5px var(--stamp); } }
.board-frame.flash-ok { animation: fok .8s; }
@keyframes fok { 30% { box-shadow: 0 0 0 5px var(--ok); } }
.promo { position: absolute; inset: 0; z-index: 5; background: rgba(0, 0, 0, .45); display: grid; place-items: center; }
.promo-box { display: flex; gap: 6px; padding: 8px; background: var(--card); }
.promo-box button { width: 60px; aspect-ratio: 1; border: 1px solid var(--line-2); background: var(--sq-l); cursor: pointer; }
.promo-box svg { width: 100%; height: 100%; }

/* teletype tape under the board */
.tape { position: relative; height: 34px; background: #f7f0dc; border: 1px solid var(--line-2); display: flex; align-items: center; overflow: hidden; padding-inline: 14px; font-family: var(--f-mono); font-size: 14px; color: #2a2721; white-space: nowrap; }
.tape::before, .tape::after { content: ""; position: absolute; left: 0; right: 0; height: 5px; background: radial-gradient(circle, rgba(31, 29, 26, .35) 1.6px, transparent 2px) 0 0 / 12px 5px repeat-x; }
.tape::before { top: 2px; }
.tape::after { bottom: 2px; }
.tape .tm { display: flex; gap: 10px; margin-left: auto; }
.tape .tm span.n { color: #8a8170; }
.tape .lead { color: #8a8170; }

/* ---------- dossier card ---------- */
.card { position: relative; background: var(--card); border: 1px solid var(--line-2); padding: 22px 22px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card::before { content: ""; position: absolute; top: -12px; left: 26px; width: 16px; height: 44px; border: 3px solid #8b8f96; border-radius: 9px; border-bottom-color: transparent; transform: rotate(8deg); }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.kicker b { color: var(--stamp); font-weight: 400; }
.title { font-family: var(--f-serif); font-weight: 700; font-size: clamp(26px, 2.5vw, 36px); line-height: 1.05; letter-spacing: -.01em; }
.task { font-family: var(--f-mono); font-size: 15px; line-height: 1.45; }
.task b { color: var(--stamp); font-weight: 700; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--f-mono); font-size: 14px; }
.rules li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.rules li::before { content: "▪"; color: var(--stamp); }
.note { border-left: 3px solid var(--ribbon); padding: 2px 0 2px 12px; color: var(--muted); font-size: 15px; }
.note b { color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 9px 15px; border-radius: 3px; cursor: pointer; font-family: var(--f-mono); font-size: 14px; line-height: 1.1; transition: background .15s, color .15s, transform .1s; }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--card); }
.btn.primary:hover { background: var(--stamp); border-color: var(--stamp); }
.btn.hint { border-style: dashed; color: var(--ribbon); border-color: var(--ribbon); }
.btn.big { padding: 12px 20px; font-size: 15px; }
.btn.armed { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.grid3 { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 13px; }
.grid3 .lab { color: var(--muted); padding-right: 6px; }
.grid3 button { border: 1px solid var(--line-2); background: transparent; padding: 9px 4px; cursor: pointer; font-family: var(--f-mono); font-size: 13px; border-radius: 3px; }
.grid3 button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.grid3 button.right { background: var(--ok); color: #fff; border-color: var(--ok); }
.grid3 button.wrong { background: var(--stamp-soft); border-color: var(--stamp); }
.fb { min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--paper-2); border-left: 3px solid var(--line-2); font-family: var(--f-mono); font-size: 13.5px; }
.fb:empty { background: transparent; border-color: transparent; }
.fb[data-type="ok"] { background: var(--ok-soft); border-left-color: var(--ok); }
.fb[data-type="bad"] { background: var(--stamp-soft); border-left-color: var(--stamp); }
.fb[data-type="warn"] { background: var(--ribbon-soft); border-left-color: var(--ribbon); }
.fb-mark { flex: none; width: 20px; height: 20px; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid currentColor; border-radius: 50%; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.holes { display: flex; gap: 5px; }
.holes i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.holes i.done { background: var(--ink); border-color: var(--ink); }
.holes i.miss { background: var(--stamp); border-color: var(--stamp); }
.holes i.now { border-color: var(--stamp); border-width: 2.5px; }

/* cipher strip */
.strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.strip div { border: 1px solid var(--line-2); padding: 6px 4px; text-align: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); background: var(--paper-2); }
.strip div b { display: block; font-family: var(--f-stamp); font-size: 22px; color: var(--ink); line-height: 1.2; }
.strip div.now { border-color: var(--stamp); }
.strip div.done b { color: var(--stamp); }

/* rubber stamp */
.stampmark { position: absolute; right: 0; top: 50%; margin-top: -19px; font-family: var(--f-stamp); font-size: 17px; letter-spacing: .06em; color: var(--stamp); border: 3px double var(--stamp); padding: 5px 10px 3px; border-radius: 4px; transform: rotate(-9deg); opacity: .88; pointer-events: none; animation: stampin .35s cubic-bezier(.2, 1.5, .4, 1); mix-blend-mode: multiply; }
.stampmark.ok { color: var(--ok); border-color: var(--ok); }
.card > .stampmark { top: 14px; right: 16px; margin: 0; }
.stampmark.big { left: 50%; top: 50%; right: auto; margin: 0; translate: -50% -50%; z-index: 4; font-size: clamp(26px, 4.6vw, 54px); border-width: 7px; padding: 10px 22px 6px; background: rgba(248, 242, 227, .35); animation: stampin .35s cubic-bezier(.2, 1.5, .4, 1), stampfade .8s 2.4s forwards; }
@keyframes stampfade { to { opacity: .22; } }
.seal-row { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.stampslot { position: relative; flex: 1; align-self: stretch; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stampmark { mix-blend-mode: normal; } }
:root[data-theme="dark"] .stampmark { mix-blend-mode: normal; }
@keyframes stampin { from { transform: rotate(-9deg) scale(2.2); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: .88; } }
.seals-big { display: flex; gap: 8px; }
.seals-big i { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 34% 32%, rgba(255, 255, 255, .45), transparent 34%), var(--stamp); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .14), 0 2px 4px rgba(0, 0, 0, .18); animation: pop .4s cubic-bezier(.2, 1.4, .5, 1) backwards; }
.seals-big i:nth-child(2) { animation-delay: .12s; }
.seals-big i:nth-child(3) { animation-delay: .24s; }
.seals-big i.off { background: transparent; border: 2px dashed var(--line-2); box-shadow: none; }
.answer-row { display: flex; gap: 8px; }
.answer-row input { flex: 1; min-width: 0; font-family: var(--f-stamp); font-size: 22px; padding: 8px 12px; border: 1px solid var(--ink); background: var(--paper-2); color: var(--ink); border-radius: 3px; }
.links { display: grid; gap: 6px; }
.links a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-2); text-decoration: none; color: var(--ink); font-family: var(--f-mono); font-size: 13px; background: var(--paper-2); }
.links a span { color: var(--muted); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 60; background: var(--card); border-left: 2px solid var(--ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 20px; overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; font-family: var(--f-mono); font-size: 14px; }
.drawer.open { transform: none; }
.drawer h3 { font-family: var(--f-serif); font-size: 22px; margin-bottom: 10px; }
.drawer ul { padding-left: 18px; margin: 0; display: grid; gap: 8px; color: var(--muted); }
.drawer .close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

@media (max-width: 1500px) { .case span { display: none; } }
@media (max-width: 980px) {
  #app { grid-template-rows: auto minmax(0, 1fr); }

/* ---------- duel: student plays White, computer defends perfectly ---------- */
function makeDuel(o) {
  // o: { fen, budget, onWin(stats), onFail(), onStep(), hintBtn }
  const g = kgame(o.fen);
  let pos, w, b, sans, movesW, mistakes, hints, busy, over, snap, gen = 0;
  const budget = o.budget || 99;
  function reset() {
    gen++; demoGen++;
    pos = new Position(o.fen); w = g.w; b = g.b; sans = []; movesW = 0; busy = false; over = false; snap = null;
    board.setOrient('w'); board.set(pos); board.layers = null; board.arrows = []; tape([], o.fen);
  }
  mistakes = 0; hints = 0; reset();
  board.canMove = () => !busy && !over && pos.turn === 'w';
  board.onMove = mv => {
    const before = { fen: pos.fen(), w, b, sans: sans.slice(), movesW };
    const r = board.play(mv); if (!r) return;
    board.layers = null; board.render();
    sans.push(r.san); movesW++; tape(sans, o.fen);
    if (r.m.captured) { over = true; flash($('#frame'), 'ok'); o.onWin({ moves: movesW, mistakes, hints, sans }); return; }
    w = r.m.to;
    const v = g.S.info(w, b, 1);
    if (v.v !== 1) {
      over = true; mistakes++; snap = before; Sound.bad(); flash($('#frame'), 'bad');
      const alts = g.S.moves(before.w, b, 0).filter(m => m.v === 1).map(m => sqName(m.to));
      o.onMistake(r.san, alts);
      return;
    }
    if (movesW >= budget) { over = true; Sound.bad(); o.onSlow(); return; }
    busy = true; const g0 = gen;
    later(() => {
      if (g0 !== gen) return;
      const m = g.S.moves(w, b, 1)[0];
      const rr = board.play({ from: b, to: m.to, promotion: '' });
      sans.push(rr.san); b = m.to; tape(sans, o.fen); busy = false;
      o.onStep(rr.san, g.S.info(w, b, 0).d, movesW);
    }, 520);
  };
  return {
    undo() { if (!snap) return; gen++; demoGen++; pos = new Position(snap.fen); w = snap.w; b = snap.b; sans = snap.sans; movesW = snap.movesW; snap = null; over = false; board.set(pos); tape(sans, o.fen); },
    restart() { reset(); },
    hint() {
      if (over || busy) return false;
      hints++;
      const ms = g.S.moves(w, b, 0).filter(m => m.v === 1); const best = ms.length ? ms[0].d : 0;
      const sqs = ms.filter(m => m.d === best).map(m => m.to);
      board.layers = bb => dotsL(bb, sqs, 'var(--ok)'); board.render();
      return sqs.map(sqName);
    },
    stats: () => ({ mistakes, hints, movesW }),
    dist: () => g.S.info(w, b, 0).d,
    state: () => ({ w, b, fen: pos.fen() }),
    pos: () => pos
  };
}

function duelChapter(ch, list, cfg) {

      `<div class="meta"><span id="mv">ход 0 / ${budget}</span><span id="dist">радар: ${movesWord(d.best)} до пешки</span></div>
      <div class="fb" id="fb"></div>
      <div class="controls" id="ctl"></div>`;
    const play = () => { ctl(B('hintB', 'Дешифратор', 'hint') + B('rsB', 'Заново')); on('hintB', hint); on('rsB', restart); };
    const restart = () => { duel.restart(); say(); play(); $('#mv').textContent = `ход 0 / ${budget}`; $('#dist').textContent = `радар: ${movesWord(d.best)} до пешки`; };
    const hint = () => { const sq = duel.hint(); if (sq) { say('warn', `Дешифратор: кратчайший путь идёт через ${sq.map(ruK).join(' или ')}.`); Sound.reveal(); } };
    play();

      fen: d.fen, budget,
      onStep(bsan, dd, mw) { $('#mv').textContent = `ход ${mw} / ${budget}`; $('#dist').textContent = `радар: ${movesWord(nMoves(dd))} до пешки`; say(); },
      onMistake(san) {
        say('bad', cfg.mistake ? cfg.mistake(san) : `${esc(ru(san))}? Теперь чёрные держат оборону — пешку не взять.`);
        ctl(B('unB', '↶ Вернуть ход', 'primary') + B('rsB', 'Заново'));
        on('unB', () => { duel.undo(); say(); play(); $('#dist').textContent = `радар: ${movesWord(nMoves(duel.dist()))} до пешки`; }); on('rsB', restart);
      },
      onSlow() { errs++; say('warn', `Лимит ${budget} ${plural(budget, 'ход', 'хода', 'ходов')} исчерпан. Путь есть короче — ещё раз!`); ctl(B('rsB', 'Заново', 'primary')); on('rsB', restart); },
      onWin(st) {

        if (list.length > 1) card.querySelector('.kicker b').innerHTML = holes(list.length, i, res);
        if (cfg.afterWin) cfg.afterWin(d);
        const last = i === list.length - 1;
        if (cfg.final && last) { cfg.final(scoreBy(errs), st); return; }
        say('ok', esc(d.note));
        ctl(B('nx', last ? 'Итог главы →' : 'Следующая позиция →', 'primary'));

      }

  }

  }
  return { enter() { i = 0; res = []; errs = 0; show(); } };
}

})();

/* IV — the cipher table */
IMPL[6] = (() => {
  const C = D.cipher; const g = kgame(LR); const S = g.S;
  const ZONE = s => (s & 7) <= 3 && (s >> 3) >= 6;
  let i, res, miss, roundMiss, busy;
  function zoneMarks() { const m = {}; for (let s = 0; s < 64; s++) if (ZONE(s)) m[sqName(s)] = 'zone'; return m; }
  function strip() { return `<div class="strip" id="strip">${C.map((c, k) => `<div class="${k < i ? 'done' : (k === i ? 'now' : '')}"><b>${k < i ? c.letter : '·'}</b>${c.w}</div>`).join('')}</div>`; }
  function show() {
    const c = C[i]; busy = false; roundMiss = false;
    board.set(new Position(fenWith(LR, sqIndex(c.w), -1, 'w'))); board.marks = zoneMarks(); board.render();
    $('#board').classList.add('clicky');
    card.innerHTML = head('Глава IV', holes(6, i, res), 'Таблица соответствия', `Белый король на <b>${c.w}</b>, ход белых. Куда поставить чёрного короля, чтобы удержать ничью? Ищите в красной зоне.`) +
      strip() + `<div class="fb" id="fb"></div>`;
  }
  function finish() {
    const lab = {}; C.forEach(c => { lab[c.w] = (lab[c.w] || '') + c.letter; c.holds.forEach(h => { if (!(lab[h] || '').includes(c.letter)) lab[h] = (lab[h] || '') + c.letter; }); });
    board.set(new Position(fenWith(LR, -1, -1, 'w'))); board.marks = {};
    board.layers = bb => numsL(bb, Object.keys(lab).map(s => [sqIndex(s), lab[s]])); board.render();
    $('#board').classList.remove('clicky');
    card.innerHTML = head('Глава IV', 'ЛАСКЕР', 'Таблица собрана', '') + strip() +
      finishCard(6, scoreBy(miss), 'Одинаковые буквы — соответствующие поля. Белый король на «Л» — чёрный должен стоять на «Л». Не успел — проиграл.');
  }
  return {
    enter() { i = 0; res = []; miss = 0; show(); },
    onSquare(s) {
      if (busy || i >= C.length || !ZONE(s)) return;
      const c = C[i]; const w = sqIndex(c.w); const name = sqName(s);
      if (c.holds.includes(name)) {
        busy = true; res[i] = !roundMiss;
        board.set(new Position(fenWith(LR, w, s, 'w')), { pop: true }); board.marks = zoneMarks(); board.marks[name] = 'ok'; board.render();
        Sound.reveal(); i++; $('#strip').outerHTML = strip(); card.querySelector('.kicker b').innerHTML = holes(6, i, res);
        say('ok', `${ruK(c.w)} ↔ ${ruK(c.holds.join('/'))}: буква «${c.letter}».`);
        later(() => { if (i >= C.length) finish(); else show(); }, 1300);
      } else {
        miss++; roundMiss = true; busy = true; Sound.bad();
        const m = S.moves(w, s, 0).find(x => x.v === 1);
        board.set(new Position(fenWith(LR, w, s, 'w'))); board.marks = zoneMarks(); board.marks[name] = 'bad';
        if (m) board.arrows = [{ from: w, to: m.to, color: 'var(--stamp)' }];
        board.render();
        say('bad', m ? `Прорыв: ${ruK(sqName(m.to))}, и через ${movesWord(nMoves(S.info(w, s, 0).d))} пешка падёт.` : 'Здесь чёрные не держатся.');
        later(() => { board.set(new Position(fenWith(LR, w, -1, 'w'))); board.marks = zoneMarks(); board.marks[name] = 'bad'; board.render(); busy = false; }, 1500);
      }
    }
  };
})();

/* V — defence: student plays Black */
IMPL[7] = (() => {
  const g = kgame(D.defend.fen); const S = g.S; const GOAL = D.defend.moves;
  let pos, w, b, n, mistakes, hints, busy, over, snap, sans, gen = 0;
  function meta() { $('#mv').textContent = `продержались: ${n} / ${GOAL}`; }
  function holdSq() { return S.moves(w, b, 1).filter(m => m.v === 0).map(m => m.to); }
  function play() { ctl(B('hintB', 'Дешифратор', 'hint') + B('rsB', 'Заново')); on('hintB', hint); on('rsB', reset); }
  function hint() { if (busy || over) return; hints++; const h = holdSq(); board.layers = bb => dotsL(bb, h, 'var(--ok)'); board.render(); Sound.reveal(); say('warn', `Держат ничью: ${h.map(x => ruK(sqName(x))).join(', ')}.`); }
  function reset() {
    gen++; demoGen++;
    pos = new Position(D.defend.fen); w = g.w; b = g.b; n = 0; busy = false; over = false; snap = null; sans = [];
    board.setOrient('b'); board.set(pos); board.layers = null; tape([], D.defend.fen); say(); play(); meta();
  }
  function whiteReply() {
    let ms = S.moves(w, b, 0);
    const win = ms.filter(m => m.v === 1); if (win.length) ms = win.slice(0, 1);
    else ms = ms.filter(m => m.v === 0);
    let best = -1, pick = [];
    ms.forEach(m => { const traps = S.moves(m.to, b, 1).filter(x => x.v === 1).length; if (traps > best) { best = traps; pick = [m]; } else if (traps === best) pick.push(m); });
    return pick[Math.floor(Math.random() * pick.length)];
  }
  function enter() {
    mistakes = 0; hints = 0;
    card.innerHTML = head('Глава V', 'оборона', 'Ход чёрных', 'Та же позиция Ласкера, но ход за чёрными — и это ничья. Вы играете чёрными. Продержитесь <b>' + GOAL + '</b> ходов.') +
      `<div class="meta"><span id="mv"></span><span>белые ищут брешь</span></div><div class="fb" id="fb"></div><div class="controls" id="ctl"></div>`;
    reset();
    board.canMove = () => !busy && !over && pos.turn === 'b';
    board.onMove = mv => {
      const before = { fen: pos.fen(), b, sans: sans.slice() };
      const r = board.play(mv); if (!r) return;
      board.layers = null; board.render();
      sans.push(r.san); tape(sans, D.defend.fen);
      b = r.m.to;
      const v = S.info(w, b, 0);
      if (r.m.captured || v.v !== 1) { n++; meta(); }
      if (v.v === 1) {
        over = true; mistakes++; snap = before; Sound.bad(); flash($('#frame'), 'bad');
        const holdBefore = S.moves(w, before.b, 1).filter(m => m.v === 0).map(m => m.to);
        say('bad', `${esc(ru(r.san))}? Брешь! Белые прорываются за ${movesWord(nMoves(v.d))}. Держали: ${holdBefore.map(x => ruK(sqName(x))).join(', ')}.`);
        ctl(B('unB', '↶ Вернуть ход', 'primary') + B('demoB', '▶ Показать прорыв') + B('rsB', 'Заново'));
        on('unB', () => { gen++; demoGen++; pos = new Position(snap.fen); b = snap.b; sans = snap.sans; snap = null; over = false; board.set(pos); board.layers = null; tape(sans, D.defend.fen); say(); play(); });
        on('demoB', () => demo(pos.fen(), 30, () => say('bad', 'Пешка пала. Вернём ход?')));
        on('rsB', reset);
        return;
      }
      if (n >= GOAL) {
        over = true; flash($('#frame'), 'ok');
        const k = 3 - mistakes - hints;
        later(() => { card.innerHTML = head('Глава V', 'оборона', 'Оборона выстояла', '') + finishCard(7, k, 'Чёрные держатся, пока их король стоит на поле, соответствующем полю белого. Поэтому в задаче Ласкера так важна очередь хода.'); }, 400);
        return;
      }
      busy = true; const g0 = gen;
      later(() => {
        if (g0 !== gen) return;
        const m = whiteReply(); if (!m) { busy = false; return; }
        const rr = board.play({ from: w, to: m.to, promotion: '' });
        sans.push(rr.san); w = m.to; tape(sans, D.defend.fen); busy = false;
      }, 560);
    };
  }
  return { enter, leave() { board.setOrient('w'); } };
})();

/* ★ — declassified */
IMPL[9] = (() => {
  const RANKS = [[21, 'Начальник шифрбюро'], [15, 'Старший шифровальщик'], [8, 'Шифровальщик'], [0, 'Стажёр бюро']];
  return {
    enter() {
      const t = totalSeals(); const rank = RANKS.find(r => t >= r[0])[1];
      board.set(new Position(LR)); board.arrows = [{ from: sqIndex('a1'), to: sqIndex('b1'), color: 'var(--ok)' }]; board.render();
      tape(['Kb1', 'Kb7', 'Kc1', 'Kc7', 'Kd1', 'Kd8', 'Kc2', 'Kc8', 'Kd2', 'Kd7', 'Kc3', 'Kc7', 'Kd3'], LR);
      card.innerHTML = head('Дело закрыто', `${t} / 24`, rank, '') +
        `<ul class="rules">
          <li><span><b>Цугцванг</b> — ход во вред.</span></li>
          <li><span><b>Оппозиция</b> — нечётное число полей между королями.</span></li>
          <li><span><b>Треугольник</b> — три хода против двух.</span></li>
          <li><span><b>Поля соответствия</b> — каждому полю белых своё поле чёрных.</span></li>
        </ul>
        <p class="note"><b>Домашка:</b> Lichess Practice — «Opposition», «Key Squares», «Triangulation».</p>
        <div class="links">
          <a href="https://lichess.org/practice" target="_blank" rel="noopener">Lichess Practice <span>↗</span></a>
          <a href="https://en.wikipedia.org/wiki/Corresponding_squares" target="_blank" rel="noopener">Поля соответствия <span>↗</span></a>
          <a href="https://en.wikipedia.org/wiki/Triangulation_(chess)" target="_blank" rel="noopener">Треугольник <span>↗</span></a>
        </div>
        <div class="fb" id="fb"></div>
        <div class="controls" id="ctl">${B('pgnB', 'Скопировать PGN', 'primary')}${B('resetB', 'Сбросить печати')}</div>`;
      if (t >= 15) setTimeout(() => { stamp('РАССЕКРЕЧЕНО', true, true); Confetti.burst(1); Sound.fanfare(); }, 150);
      on('pgnB', () => {
        const txt = window.CIPHER_PGN || '';
        const done = () => say('ok', 'PGN скопирован: Lichess → Исследование → Импорт PGN.');
        const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { say('warn', 'Не удалось скопировать автоматически.'); } ta.remove(); };
        try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
      });
      twoStep($('#resetB'), 'Точно сбросить?', () => { state = { v: 1, ch: 0, seals: {} }; save(); go(0); });
    }
  };
})();

/* ---------- boot ---------- */
renderTabs();
go(Math.min(9, Math.max(0, state.ch || 0)));
})();

</script>
