<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Academy bridge: lets a lesson running inside «Звёздная академия» report stars per student.
   Standalone (no academy) the lesson behaves exactly as before: window.Academy.on === false. */
(function () {
  var L = 'L06';
  var embed = false;
  try { embed = !!window.ACADEMY_EMBED || /[?&]academy=1/.test(location.search); } catch (e) { embed = false; }
  if (embed && window.parent === window) embed = false;
  var roster = [], tablo = {}, subs = [];
  function post(m) { m.__academy = 1; m.lesson = L; try { window.parent.postMessage(m, '*'); } catch (e) { /* parent unreachable */ } }
  function emit() { subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener error */ } }); }
  var A = {
    on: embed,
    lesson: L,
    roster: function () { return roster; },
    tablo: function () { return tablo; },
    onRoster: function (f) { subs.push(f); },
    /* key: chapter id for 'best' (keeps the student's best result), or null for 'add' (adds up) */
    reward: function (key, n, label, mode) {
      if (!embed) return;
      n = Math.round(+n || 0); if (n <= 0) return;
      post({ type: 'reward', key: key, n: n, label: String(label || ''), mode: mode || 'best' });
    },
    points: function (id, d) {
      if (!embed) return;
      var was = tablo[id] || 0, now = Math.max(0, was + (Math.round(+d) || 0));
      if (now === was) return;
      tablo[id] = now; emit();
      post({ type: 'points', student: id, d: now - was });
    },
    addStudent: function (name) { if (embed) post({ type: 'add-student', name: String(name || '').slice(0, 40) }); },
    rename: function (id, name) { if (embed) post({ type: 'rename', student: id, name: String(name || '').slice(0, 40) }); },
    download: function (filename, data) { if (embed) post({ type: 'download', filename: filename, data: data }); },
    scores: function () {
      return {
        list: function () { return roster.map(function (s) { return { id: s.id, n: s.name, s: tablo[s.id] || 0 }; }); },
        sorted: function () { return this.list().sort(function (a, b) { return b.s - a.s; }); },
        isExample: function () { return false; },
        add: function (n) { A.addStudent(n); },
        inc: function (id, d) { A.points(id, d); },
        rename: function (id, n) { var r = roster.find(function (x) { return x.id === id; }); if (r) r.name = n; A.rename(id, n); },
        remove: function () {}, zero: function () {}, clear: function () {},
        on: function (f) { subs.push(function () { f(); }); }
      };
    }
  };
  window.Academy = A;
  if (!embed) return;
  document.documentElement.classList.add('academy');
  var st = document.createElement('style');
  st.textContent = '.academy #sc-zero,.academy #sc-clear,.academy .sc-row .x{display:none!important}.academy .sc-row{grid-template-columns:22px 1fr auto auto auto!important}';
  (document.head || document.documentElement).appendChild(st);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__academy || e.source !== window.parent) return;
    if (d.type === 'roster') { roster = Array.isArray(d.students) ? d.students : []; tablo = d.tablo || {}; emit(); }
  });
  post({ type: 'hello' });
})();
</script>

<body>
<style>
/* «Конь-спрут» — nautical chart: seafoam paper, navy ink, coral buoys */
:root {
  --paper: #eef3f1;
  --paper-2: #e3ebe8;
  --panel: #f9fbfa;
  --ink: #10263a;
  --muted: #587083;
  --line: rgba(16, 38, 58, .12);
  --line-2: rgba(16, 38, 58, .24);
  --coral: #e85f3e;
  --coral-soft: rgba(232, 95, 62, .16);
  --sea: #24857f;
  --sea-soft: rgba(36, 133, 127, .16);
  --gold: #d49a26;
  --sq-l: #ebe3cf;
  --sq-d: #86aaa8;
  --hatch: rgba(16, 38, 58, .26);
  --arrow: rgba(232, 95, 62, .88);
  --shadow: 0 18px 40px -24px rgba(16, 38, 58, .45);
  --frame: #10263a;
  --f-disp: 'Literata', 'Georgia', 'Times New Roman', serif;
  --f-body: 'Onest', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', 'Consolas', monospace;
  --bar: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0c1a23; --paper-2: #10222d; --panel: #132833; --ink: #e2ecef; --muted: #8ea6b2;
    --line: rgba(226, 236, 239, .1); --line-2: rgba(226, 236, 239, .22);
    --coral: #ff8063; --coral-soft: rgba(255, 128, 99, .18); --sea: #4dc0b5; --sea-soft: rgba(77, 192, 181, .18); --gold: #f0b94a;
    --sq-l: #d6ccb2; --sq-d: #5f8987; --hatch: rgba(8, 20, 28, .38); --arrow: rgba(255, 128, 99, .9);
    --shadow: 0 18px 40px -20px rgba(0, 0, 0, .7); --frame: #050f15;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0c1a23; --paper-2: #10222d; --panel: #132833; --ink: #e2ecef; --muted: #8ea6b2;
  --line: rgba(226, 236, 239, .1); --line-2: rgba(226, 236, 239, .22);
  --coral: #ff8063; --coral-soft: rgba(255, 128, 99, .18); --sea: #4dc0b5; --sea-soft: rgba(77, 192, 181, .18); --gold: #f0b94a;
  --sq-l: #d6ccb2; --sq-d: #5f8987; --hatch: rgba(8, 20, 28, .38); --arrow: rgba(255, 128, 99, .9);
  --shadow: 0 18px 40px -20px rgba(0, 0, 0, .7); --frame: #050f15;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
    var(--paper);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--sea); }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

#app { min-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); padding-inline: 16px; }

/* ---------- top bar ---------- */
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; border-bottom: 1px solid var(--line-2); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 36px; height: 36px; border-radius: 50%; background: var(--coral); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--coral); }
.brand .mark svg { width: 26px; height: 26px; }
.brand b { font-family: var(--f-disp); font-weight: 700; font-style: italic; font-size: 21px; letter-spacing: -.01em; }
.rail { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.rail > :first-child { margin-left: auto; }
.rail > :last-child { margin-right: auto; }
.rail::-webkit-scrollbar { display: none; }
.rail button { flex: none; display: flex; align-items: center; gap: 7px; border: 1px solid transparent; background: transparent; border-radius: 999px; padding: 5px 11px 5px 6px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.rail button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line-2); }
.rail button .st { font-size: 10px; letter-spacing: -1px; color: var(--gold); }
.rail button:hover { color: var(--ink); border-color: var(--line-2); }
.rail button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.rail button[aria-current="true"] .n { border-color: transparent; background: var(--coral); color: #fff; }
.tools { display: flex; align-items: center; gap: 8px; }
.score { font-family: var(--f-mono); font-size: 14px; padding: 5px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line-2); white-space: nowrap; }
.score b { color: var(--gold); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

/* ---------- stage ---------- */
.stage { --bs: min(calc(100vh - var(--bar) - 40px), 58vw, 680px); display: grid; grid-template-columns: var(--bs) minmax(300px, 420px); justify-content: center; align-items: center; gap: 28px; padding-block: 20px; min-height: 0; }
.board-col { width: var(--bs); }
.board-frame { width: 100%; aspect-ratio: 1; padding: 8px; border-radius: 6px; background: var(--frame); box-shadow: var(--shadow); position: relative; }
.board { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; border-radius: 2px; }
.sq { position: relative; display: grid; place-items: center; }
.sq.l { background: var(--sq-l); }
.sq.d { background: var(--sq-d); }
.board.clicky .sq { cursor: pointer; }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq[data-mark]:not([data-mark=""])::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(212, 154, 38, .38); }
.sq.sel::before { background: rgba(36, 133, 127, .4); }
.sq.check::before { background: radial-gradient(circle, rgba(220, 50, 30, .9), rgba(220, 50, 30, 0) 70%); }
.sq[data-mark="pick"]::before { box-shadow: inset 0 0 0 4px var(--ink); background: rgba(16, 38, 58, .12); }
.sq[data-mark="hole"]::before { background: radial-gradient(circle, transparent 0 34%, var(--coral) 35% 45%, transparent 46%); }
.sq[data-mark="hole-new"]::before { background: radial-gradient(circle, transparent 0 34%, var(--coral) 35% 45%, transparent 46%); animation: buoy 1.2s ease-in-out infinite; }
@keyframes buoy { 50% { transform: scale(.82); } }
.sq[data-mark="miss"]::before { background: radial-gradient(circle, transparent 0 34%, var(--coral) 35% 45%, transparent 46%), rgba(232, 95, 62, .18); }
.sq[data-mark="wrong"]::before { background: repeating-linear-gradient(135deg, rgba(232, 95, 62, .5) 0 5px, transparent 5px 10px); }
.sq[data-mark="ok"]::before { background: rgba(36, 133, 127, .45); box-shadow: inset 0 0 0 3px var(--sea); }
.sq[data-mark="guard"]::before { box-shadow: inset 0 0 0 4px var(--coral); }
.sq[data-mark="flag"]::before { box-shadow: inset 0 0 0 4px var(--gold); background: rgba(212, 154, 38, .22); }
.sq.dot::after { content: ""; position: absolute; width: 26%; height: 26%; border-radius: 50%; background: rgba(16, 38, 58, .35); pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 5%; border-radius: 50%; border: 5px solid rgba(16, 38, 58, .3); pointer-events: none; }
.co { position: absolute; font-family: var(--f-mono); font-size: clamp(8px, 1.1vmin, 11px); line-height: 1; pointer-events: none; z-index: 1; }
.sq.l .co { color: #7f978f; }
.sq.d .co { color: #f1ece0; }
.co-r { top: 3px; left: 4px; }
.co-f { bottom: 3px; right: 4px; }
.pc { width: 92%; height: 92%; position: relative; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 1.5px rgba(10, 25, 35, .35)); }
.pc.anim { transition: transform .22s cubic-bezier(.3, .7, .4, 1); }
.pc.lift { opacity: .3; }
.pc.pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4)); }
.board .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.board-frame.flash-bad { animation: fbad .6s; }
@keyframes fbad { 30% { box-shadow: 0 0 0 5px var(--coral), var(--shadow); } }
.board-frame.flash-ok { animation: fok .8s; }
@keyframes fok { 30% { box-shadow: 0 0 0 5px var(--sea), var(--shadow); } }
.promo { position: absolute; inset: 0; z-index: 5; background: rgba(0, 0, 0, .45); display: grid; place-items: center; }
.promo-box { display: flex; gap: 6px; padding: 8px; background: var(--panel); border-radius: 8px; }
.promo-box button { width: 64px; aspect-ratio: 1; border: 1px solid var(--line-2); border-radius: 6px; background: var(--sq-l); cursor: pointer; }
.promo-box svg { width: 100%; height: 100%; }

/* ---------- panel ---------- */
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--coral); }
.title { font-family: var(--f-disp); font-weight: 700; font-size: clamp(26px, 2.6vw, 38px); line-height: 1.05; letter-spacing: -.015em; }
.task { font-size: 17px; line-height: 1.4; }
.task b { color: var(--coral); font-weight: 600; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.pips { display: flex; gap: 6px; }
.pips i { width: 26px; height: 6px; border-radius: 3px; background: var(--line-2); }
.pips i.done { background: var(--sea); }
.pips i.miss { background: var(--coral); }
.pips i.now { background: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); padding: 10px 16px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; line-height: 1.1; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--coral); border-color: var(--coral); }
.btn.hint { border-style: dashed; color: var(--muted); }
.btn.big { padding: 14px 22px; font-size: 16px; }
.btn.armed { background: var(--coral); border-color: var(--coral); color: #fff; }
.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.answers button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 14px; padding: 14px 0; cursor: pointer; font-family: var(--f-disp); font-size: 28px; font-weight: 700; }
.answers button:hover:not(:disabled) { border-color: var(--ink); }
.answers button.right { background: var(--sea); border-color: var(--sea); color: #fff; }
.answers button.wrong { background: var(--coral-soft); border-color: var(--coral); }
.answers button:disabled { cursor: default; }
.fb { min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; }
.fb:empty { background: transparent; border-color: transparent; }
.fb[data-type="ok"] { background: var(--sea-soft); border-color: transparent; }
.fb[data-type="bad"] { background: var(--coral-soft); border-color: transparent; }
.fb-mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--paper); }
.fb[data-type="ok"] .fb-mark { background: var(--sea); color: #fff; }
.fb[data-type="bad"] .fb-mark { background: var(--coral); color: #fff; }
.fb[data-type="warn"] .fb-mark { background: var(--gold); color: #fff; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.rule { border-left: 3px solid var(--coral); padding: 2px 0 2px 12px; color: var(--muted); font-size: 14px; }
.rule b { color: var(--ink); font-weight: 600; }
.timerbar { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.timerbar i { display: block; height: 100%; background: var(--coral); transform-origin: left; }
.stars-big { display: flex; gap: 4px; font-size: 30px; color: var(--gold); letter-spacing: 2px; }
.stars-big .off { color: var(--line-2); }
.moves { font-family: var(--f-mono); font-size: 13px; color: var(--muted); max-height: 3.2em; overflow: hidden; display: flex; flex-wrap: wrap; gap: 2px 8px; }

/* start tiles */
.tiles { display: grid; gap: 10px; }
.tile { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.tile svg { width: 44px; height: 44px; }
.tile b { display: block; font-family: var(--f-disp); font-size: 18px; }
.tile span { color: var(--muted); font-size: 14px; }

/* end card */
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 14px; }
.links a:hover { border-color: var(--ink); }
.links a span { color: var(--muted); }

/* notes drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 60; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow); padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 20px; overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; }
.drawer.open { transform: none; }
.drawer h3 { font-family: var(--f-disp); font-size: 22px; margin-bottom: 10px; }
.drawer ul { padding-left: 18px; margin: 0 0 18px; display: grid; gap: 6px; color: var(--muted); }
.drawer .close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

@media (max-width: 980px) {
  #app { grid-template-rows: auto minmax(0, 1fr); }
  .bar { grid-template-columns: minmax(0, 1fr) auto; padding-block: 10px; }
  .rail { grid-column: 1 / -1; order: 3; }
  .stage { --bs: min(100%, 560px); grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .board-col { width: 100%; max-width: 560px; }
  .panel { width: 100%; max-width: 560px; }
}
@media (max-width: 520px) {
  .rail button .lbl { display: none; }
  .rail button[aria-current="true"] .lbl { display: inline; }
  .board-frame { padding: 5px; }
  .title { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>

/* ---------- 1: radar ---------- */
IMPL[1] = (() => {
  const RR = D.radar; let i, picks, solved, mistakes, hints, res, radarOn;
  const inZone = s => (s & 7) >= 2 && (s & 7) <= 5 && (s >> 3) >= 3 && (s >> 3) <= 5;
  function draw() {
    const r = RR[i]; const pos = new Position(r.fen);
    board.set(pos);
    if (solved) r.holes.forEach(h => { board.marks[h] = 'hole'; });
    else picks.forEach(p => { board.marks[p] = 'pick'; });
    board.layers = b => DEFS + ((radarOn || solved) ? hatchL(b, [...HolesLib.radar(pos, 'b')].filter(inZone)) : '') + zoneL(b, 2, 5, 3, 5);
    board.render();
  }
  function render() {
    panel.innerHTML = head(`Игра 1 · позиция ${Math.min(i + 1, RR.length)} из ${RR.length}`, 'Радар', 'Отметьте все <b>дыры</b> чёрных внутри рамки.') + `
      <div class="meta">${pips(RR.length, i, res)}<span>ошибок: ${mistakes}</span></div>
      <p class="rule">Дыра — поле, которое чёрные пешки <b>никогда</b> не атакуют. Фигуры не в счёт.</p>
      <div class="fb" id="fb"></div>
      <div class="controls" id="ctl"></div>`;
    const ctl = $('#ctl');
    if (!solved) ctl.innerHTML = `<button type="button" class="btn primary" id="chk">Проверить</button><button type="button" class="btn hint" id="rad"${radarOn ? ' disabled' : ''}>Радар −★</button>`;
    else ctl.innerHTML = i < RR.length - 1 ? '<button type="button" class="btn primary" id="nx">Следующая позиция →</button>' : '<button type="button" class="btn primary" id="fin">Итог игры</button>';
    if ($('#chk')) $('#chk').onclick = check;
    if ($('#rad')) $('#rad').onclick = () => { radarOn = true; hints++; draw(); render(); say('warn', 'Радар включён: штрихованные поля чёрные пешки держат. Остальное в рамке — дыры.'); };
    if ($('#nx')) $('#nx').onclick = () => { i++; picks = new Set(); solved = false; radarOn = false; render(); draw(); };
    if ($('#fin')) $('#fin').onclick = finish;
    draw();
  }
  function check() {
    const want = new Set(RR[i].holes);
    const right = [...picks].filter(p => want.has(p)).length, extra = picks.size - right, miss = want.size - right;
    if (!extra && !miss) { solved = true; res[i] = mistakes === 0 && !radarOn ? true : (res[i] === undefined ? true : res[i]); Sound.ok(); flash($('#frame'), 'ok'); render(); say('ok', `Верно! ${want.size === 1 ? 'Дыра' : 'Дыры'}: <b>${[...want].join(', ')}</b>.`); return; }
    mistakes++; res[i] = false; Sound.bad(); flash($('#frame'), 'bad'); render();
    say('bad', [right ? `верно ${right}` : '', miss ? `не хватает ${miss}` : '', extra ? `лишних ${extra}` : ''].filter(Boolean).join(' · '));
  }
  function finish() {
    const stars = Math.max(1, 3 - mistakes - hints);
    panel.innerHTML = head('Игра 1 · итог', 'Радар', '') + finishCard(1, stars, `Ошибок: ${mistakes}, подсказок: ${hints}. Дыры появляются там, куда пешки уже не вернутся.`);
  }
  function enter() { i = 0; picks = new Set(); solved = false; mistakes = 0; hints = 0; res = []; radarOn = false; $('#board').classList.add('clicky'); render(); }
  function onSquare(s) {
    if (solved || !inZone(s)) return;
    const n = sqName(s); picks.has(n) ? picks.delete(n) : picks.add(n);
    Sound.tick(); draw();
  }
  return { enter, onSquare };
})();

/* ---------- 2: outpost blitz ---------- */

/* ---------- 3: knight maze ---------- */
function safeFn(fen, from) {
  const base = new Position(fen), me = base.turn, N = me === 'w' ? 'N' : 'n';
  return s => {
    if (base.board[s]) return false;
    const p = new Position(fen); p.board[from] = ''; p.board[s] = N; p.turn = me === 'w' ? 'b' : 'w';
    const q = new Position(p.fen());
    if (q.inCheck(me)) return false;
    return TrapLib.see(q, s) <= 0;
  };
}
IMPL[3] = (() => {
  const MM = D.maze; let li, pos, kn, moves, losses, trail, done, hint, lvlStars, busy;
  const lv = () => MM[li];
  function draw() {
    const m = lv();

    board.render();
  }
  function render() {
    const m = lv();
    panel.innerHTML = head(`Игра 3 · уровень ${li + 1} из ${MM.length}`, 'Маршрут', `Доведите коня до <b>${m.to}</b>. Лучший путь — ${m.best} ${plural(m.best, 'ход', 'хода', 'ходов')}.`) + `
      <div class="meta">${pips(MM.length, li, lvlStars.map(x => x === undefined ? undefined : x >= 2))}<span id="mstat">ходов: ${moves} · потерь: ${losses}</span></div>
      ${m.story ? `<p class="rule">${m.story}</p>` : '<p class="rule">Соперник стоит на месте, но бьёт коня, если тот встал под удар.</p>'}
      <div class="fb" id="fb"></div>
      <div class="controls" id="ctl"><button type="button" class="btn hint" id="mh"${hint ? ' disabled' : ''}>Опасные поля −★</button><button type="button" class="btn" id="mr">Заново</button></div>`;
    $('#mh').onclick = () => { hint = true; draw(); render(); };
    $('#mr').onclick = () => { load(li, true); };
  }
  function load(k, keepStats) {
    li = k; const m = lv();
    pos = new Position(m.fen); kn = sqi(m.from); moves = 0; trail = [kn]; done = false; busy = false;
    if (!keepStats) { losses = 0; hint = false; }
    board.setOrient(pos.turn);
    render(); draw();
  }
  function onSquare(s) {
    if (done || busy) return;
    if (!HolesLib.knightSteps(kn).includes(s) || pos.board[s]) return;
    const m = lv(), safe = safeFn(m.fen, sqi(m.from))(s);
    const N = pos.board[kn];

  function base() { return new Position(GG[i].fen); }
  function render() {
    const g = GG[i];
    const task = step === 1 ? `Кто из чёрных охраняет дыру <b>${g.hole}</b>?` : (step === 2 ? `Разменяйте сторожа на <b>${g.guard}</b>.` : `Поле <b>${g.hole}</b> свободно.`);
    panel.innerHTML = head(`Игра 5 · позиция ${i + 1} из ${GG.length}`, 'Сторож', task) + `
      <div class="meta">${pips(GG.length, i, res)}<span>${esc(g.title)}</span><span id="gm">ошибок: ${mistakes}</span></div>
      <p class="rule">${step === 1 ? 'Нажмите на чёрную фигуру.' : (step === 2 ? 'Сделайте ход белыми на доске.' : 'Теперь туда можно ставить коня — выгнать его нечем.')}</p>
      <div class="fb" id="fb"></div>
      <div class="controls" id="ctl"></div>`;
  }
  function draw(pos) {
    const g = GG[i];
    board.set(pos || base());
    board.marks[g.hole] = step === 3 ? 'ok' : 'hole';
    if (step >= 2 && step < 3) { board.marks[g.guard] = 'guard'; board.arrows = [{ from: sqi(g.guard), to: sqi(g.hole) }]; }
    board.render();
  }
  function load(k) {
    i = k; step = 1; busy = false;
    $('#board').classList.add('clicky');
    board.canMove = () => step === 2 && !busy;
    render(); draw();
  }
  function onSquare(s) {
    if (step !== 1) return;
    const g = GG[i], pc = board.pos.board[s];
    if (!pc || pc !== pc.toLowerCase() || pc === 'k') return;
    if (sqName(s) === g.guard) {
      step = 2; $('#board').classList.remove('clicky'); Sound.ok(); render(); draw();
      say('ok', `Верно: ${PNAME[pc]} ${g.guard} держит ${g.hole}.`);
    } else {
      mistakes++; res[i] = false; Sound.bad(); board.marks[sqName(s)] = 'wrong'; board.render();
      say('bad', `${PNAME[pc][0].toUpperCase() + PNAME[pc].slice(1)} ${sqName(s)} на ${g.hole} не смотрит.`);
      if ($('#gm')) $('#gm').textContent = `ошибок: ${mistakes}`;
    }
  }
  board.onMove = null;
  function onMove(mv) {
    const g = GG[i]; const r = board.play(mv); if (!r) return;
    if (!g.good.some(x => x.replace(/[+#]/g, '') === r.san.replace(/[+#]/g, ''))) {
      busy = true; mistakes++; res[i] = false; Sound.bad(); flash($('#frame'), 'bad');
      say('bad', `<b>${esc(ru(r.san))}</b> не снимает охрану с ${g.hole}.`);
      setTimeout(() => { busy = false; draw(); }, 900);
      return;
    }
    busy = true;
    say('ok', `${esc(ru(r.san))} — сторож снят!`);
    setTimeout(() => {
      const p = board.pos;
      const reps = p.moves().filter(m => m.to === r.m.to).sort((a, b) => TrapLib.VAL[a.piece.toLowerCase()] - TrapLib.VAL[b.piece.toLowerCase()]);
      let rep = null; if (reps[0]) rep = board.play(reps[0]);
      step = 3; if (res[i] === undefined) res[i] = true;
      Sound.ok(); flash($('#frame'), 'ok');
      render(); draw(board.pos);
      say('ok', `${rep ? 'Чёрные взяли обратно: ' + esc(ru(rep.san)) + '. ' : ''}Охраны у <b>${g.hole}</b> больше нет.`);
      $('#ctl').innerHTML = `<button type="button" class="btn primary" id="nx">${i < GG.length - 1 ? 'Следующая позиция →' : 'Итог игры'}</button>`;
      $('#nx').onclick = () => { if (i < GG.length - 1) load(i + 1); else finish(); };
    }, 650);
  }
  function finish() {
    board.canMove = () => false;
    const stars = mistakes === 0 ? 3 : (mistakes <= 2 ? 2 : 1);
    panel.innerHTML = head('Игра 5 · итог', 'Сторож', '') + finishCard(5, stars, `Ошибок: ${mistakes}. Нет сторожа — нет защиты у дыры: размен защитника открывает форпост.`);
  }
  function enter() { mistakes = 0; res = []; board.onMove = onMove; load(0); }
  return { enter, onSquare };
})();

/* ---------- 6: octopus — guess the move ---------- */
IMPL[6] = (() => {
  const O = D.octopus; let pos, ply, si, pts, tries, hinted, busy, mapOn, playing = 0, lastMsg = null;
  const norm = s => s.replace(/[+#!?]/g, '');
  function movesHtml() {
    const from = Math.max(0, ply - 8);
    const out = [];
    for (let k = from; k < ply; k++) out.push(`${k % 2 === 0 ? `<span>${(k >> 1) + 1}.` : '<span>'}${esc(ru(O.moves[k]))}</span>`);
    return out.join('');
  }
  function octoLayer(b) {
    if (!mapOn) return '';
    const d3 = sqi('d3'); if (pos.board[d3] !== 'n') return '';
    return dotsL(b, HolesLib.knightSteps(d3), 'var(--coral)');
  }
  function draw(last) {
    board.set(pos, last ? { last } : {});
    board.layers = b => DEFS + octoLayer(b);
    board.render();
  }
  function stop() { return O.stops[si]; }
  function render() {
    const s = stop();
    const atStop = s && ply === s.ply;
    const task = !s ? 'Белые сдались. 0–1.' : (atStop ? 'Ход чёрных. <b>Как сыграл Каспаров?</b>' : 'Смотрим партию до следующей остановки.');
    panel.innerHTML = head(`Игра 6 · остановка ${Math.min(si + 1, O.stops.length)} из ${O.stops.length}`, 'Спрут', task) + `
      <div class="meta">${pips(O.stops.length, si, O.stops.map(x => x.res))}<span>очки: ${pts} / ${O.stops.length * 3}</span></div>
      <p class="players">${esc(O.players)}</p>
      <div class="moves" id="mv">${movesHtml()}</div>
      <div class="fb" id="fb"></div>
      <div class="controls" id="ctl"></div>`;
    const ctl = $('#ctl');
    if (!s) ctl.innerHTML = '<button type="button" class="btn primary" id="ofin">Итог игры</button>';
    else if (atStop) ctl.innerHTML = `<button type="button" class="btn hint" id="ohint"${hinted ? ' disabled' : ''}>Подсказка (−2 очка)</button>`;
    else ctl.innerHTML = `<button type="button" class="btn primary" id="oplay">${ply === 0 ? 'Начать партию ▶' : 'Дальше ▶'}</button>`;
    if (ply >= O.mapPly) ctl.insertAdjacentHTML('beforeend', `<button type="button" class="btn" id="omap">${mapOn ? 'Скрыть карту спрута' : 'Карта спрута'}</button>`);
    if ($('#ofin')) $('#ofin').onclick = finish;
    if ($('#ohint')) $('#ohint').onclick = () => { hinted = true; render(); say('warn', esc(s.hint)); };
    if ($('#oplay')) $('#oplay').onclick = () => playTo(s.ply);
    if ($('#omap')) $('#omap').onclick = () => { mapOn = !mapOn; render(); draw(); if (mapOn) say('info', 'Конь d3 держит b2, b4, c1, c5, e1, e5, f2 и f4. Ладьи и ферзь белых связаны.'); };
  }
  function playTo(target) {
    if (busy) return; busy = true; const my = ++playing;
    const step = () => {
      if (my !== playing) return;
      if (ply >= target || ply >= O.moves.length) {
        busy = false; draw(); render();
        if (stop() && ply === stop().ply) say('info', 'Ваш ход за Каспарова: сделайте его на доске.');
        else if (!stop() && lastMsg) say(lastMsg[0], lastMsg[1] + ' Белые сдались: 0–1.');
        return;
      }
      const m = pos.findMove(O.moves[ply]); const san = pos.san(m); pos.make(m); ply++;
      if (m.captured) Sound.capture(); else Sound.move();
      draw({ from: m.from, to: m.to });
      const mv = $('#mv'); if (mv) mv.innerHTML = movesHtml();
      setTimeout(step, reduceMotion ? 0 : (target - ply > 12 ? 140 : 420));
    };
    render(); step();
  }
  function onMove(mv) {
    const s = stop(); if (!s || ply !== s.ply || busy) return;
    const m = pos.findMove(mv); if (!m) return;
    const san = pos.san(m);
    if (norm(san) === norm(s.answer)) {
      const gain = hinted ? 1 : (tries === 0 ? 3 : 1);
      pts += gain; s.res = tries === 0 && !hinted;
      pos.make(m); ply++; Sound.fanfare(); flash($('#frame'), 'ok');
      draw({ from: m.from, to: m.to }); next(`Да! ${esc(ru(san))} — так и было. +${gain}. ${esc(s.note)}`, 'ok');
      return;
    }
    tries++; Sound.bad(); flash($('#frame'), 'bad');
    if (tries < 2) { draw(); say('bad', `${esc(ru(san))} — нет. Ещё одна попытка.`); return; }
    s.res = false;
    const am = pos.findMove(s.answer); pos.make(am); ply++;
    draw({ from: am.from, to: am.to }); next(`Каспаров сыграл <b>${esc(ru(s.answer))}</b>. ${esc(s.note)}`, 'bad');
  }
  function next(text, type) {
    si++; tries = 0; hinted = false; lastMsg = [type, text];
    if (si === 1) mapOn = true;
    render(); draw(); say(type, text);
    if (!stop()) playTo(O.moves.length);
  }
  function finish() {
    const stars = pts >= 9 ? 3 : (pts >= 5 ? 2 : 1);
    board.canMove = () => false;
    panel.innerHTML = head('Игра 6 · итог', 'Спрут', '') + finishCard(6, stars, `Очки: ${pts} из ${O.stops.length * 3}. Конь на d3 простоял 18 ходов и связал три тяжёлые фигуры белых.`, 'Итог урока →');
  }
  function enter() {
    pos = new Position(); ply = 0; si = 0; pts = 0; tries = 0; hinted = false; busy = false; mapOn = false;
    O.stops.forEach(s => { delete s.res; });
    board.setOrient('b');
    board.canMove = () => { const s = stop(); return !!s && ply === s.ply && !busy && pos.turn === 'b'; };
    board.onMove = onMove;
    draw(); render();
    say('info', 'Каспаров играет чёрными. Четыре раза партия остановится — угадайте его ход.');
  }
  return { enter, leave() { playing++; busy = false; } };
})();

/* ---------- 7: final ---------- */
IMPL[7] = (() => {
  const RANKS = [[16, 'Спрут', 'держите доску всеми щупальцами'], [11, 'Осьминог', 'дыры видите сразу, форпосты занимаете уверенно'], [6, 'Каракатица', 'радар работает, осталось научиться занимать поля'], [0, 'Мальок', 'перечитайте три правила на старте и сыграйте ещё раз']];
  function enter() {
    const t = totalStars(); const r = RANKS.find(x => t >= x[0]);
    board.set(new Position('8/8/8/8/3n4/8/8/8 w - - 0 1'));
    board.layers = b => DEFS + dotsL(b, HolesLib.knightSteps(sqi('d4')), 'var(--coral)');
    board.render();
    panel.innerHTML = head('Итог урока', `${r[1]}`, `★ ${t} из 18 — ${r[2]}.`) + `
      <p class="rule"><b>Запомнить:</b> пешки не ходят назад → появляются дыры → дыра с опорой-пешкой становится форпостом → разменяйте сторожа и ставьте туда коня.</p>
      <div class="links">
        <a href="https://en.wikipedia.org/wiki/World_Chess_Championship_1985" target="_blank" rel="noopener"><b>Разобрать партию Карпов — Каспаров</b><span>16-я, 1985</span></a>
        <a href="https://lichess.org/study/search?q=outpost" target="_blank" rel="noopener"><b>Исследования Lichess о форпостах</b><span>выберите одно</span></a>
        <a href="https://www.chess.com/terms/outpost-chess" target="_blank" rel="noopener"><b>Термин «форпост»</b><span>с примерами</span></a>
      </div>
      <div class="controls"><button type="button" class="btn primary" id="pgn">Скопировать PGN урока</button><button type="button" class="btn" id="rst">Начать урок заново</button></div>
      <div class="fb" id="fb"></div>
      <textarea id="pgnText" readonly hidden style="width:100%;height:120px;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;font:12px/1.4 var(--f-mono)"></textarea>`;
    $('#pgn').onclick = () => {
      const ta = $('#pgnText'); ta.value = window.OCTO_PGN || '';
      const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); say('warn', 'Скопируйте выделенный текст: Ctrl+C.'); };
      try { navigator.clipboard.writeText(ta.value).then(() => say('ok', 'PGN скопирован. Lichess → Исследование → Импорт PGN.'), fallback); } catch (e) { fallback(); }
    };
    twoStep($('#rst'), 'Сбросить звёзды? Нажмите ещё раз', () => { state = { v: 1, game: 0, stars: {} }; save(); go(0); });
    if (t >= 16) Confetti.burst(1.4);
  }
  return { enter };
})();

/* ---------- boot ---------- */
renderRail();
go(state.game || 0);
})();
