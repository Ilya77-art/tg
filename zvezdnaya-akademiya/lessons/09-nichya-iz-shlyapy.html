<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Academy bridge: lets a lesson running inside «Звёздная академия» report stars per student.
   Standalone (no academy) the lesson behaves exactly as before: window.Academy.on === false. */
(function () {
  var L = 'L09';
  var embed = false;
  try { embed = !!window.ACADEMY_EMBED || /[?&]academy=1/.test(location.search); } catch (e) { embed = false; }
  if (embed && window.parent === window) embed = false;
  var roster = [], tablo = {}, subs = [];
  function post(m) { m.__academy = 1; m.lesson = L; try { window.parent.postMessage(m, '*'); } catch (e) { /* parent unreachable */ } }
  function emit() { subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener error */ } }); }
  var A = {
    on: embed,
    lesson: L,
    roster: function () { return roster; },
    tablo: function () { return tablo; },
    onRoster: function (f) { subs.push(f); },
    /* key: chapter id for 'best' (keeps the student's best result), or null for 'add' (adds up) */
    reward: function (key, n, label, mode) {
      if (!embed) return;
      n = Math.round(+n || 0); if (n <= 0) return;
      post({ type: 'reward', key: key, n: n, label: String(label || ''), mode: mode || 'best' });
    },
    points: function (id, d) {
      if (!embed) return;
      var was = tablo[id] || 0, now = Math.max(0, was + (Math.round(+d) || 0));
      if (now === was) return;
      tablo[id] = now; emit();
      post({ type: 'points', student: id, d: now - was });
    },
    addStudent: function (name) { if (embed) post({ type: 'add-student', name: String(name || '').slice(0, 40) }); },
    rename: function (id, name) { if (embed) post({ type: 'rename', student: id, name: String(name || '').slice(0, 40) }); },
    download: function (filename, data) { if (embed) post({ type: 'download', filename: filename, data: data }); },
    scores: function () {
      return {
        list: function () { return roster.map(function (s) { return { id: s.id, n: s.name, s: tablo[s.id] || 0 }; }); },
        sorted: function () { return this.list().sort(function (a, b) { return b.s - a.s; }); },
        isExample: function () { return false; },
        add: function (n) { A.addStudent(n); },
        inc: function (id, d) { A.points(id, d); },
        rename: function (id, n) { var r = roster.find(function (x) { return x.id === id; }); if (r) r.name = n; A.rename(id, n); },
        remove: function () {}, zero: function () {}, clear: function () {},
        on: function (f) { subs.push(function () { f(); }); }
      };
    }
  };
  window.Academy = A;
  if (!embed) return;
  document.documentElement.classList.add('academy');
  var st = document.createElement('style');
  st.textContent = '.academy #sc-zero,.academy #sc-clear,.academy .sc-row .x{display:none!important}.academy .sc-row{grid-template-columns:22px 1fr auto auto auto!important}';
  (document.head || document.documentElement).appendChild(st);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__academy || e.source !== window.parent) return;
    if (d.type === 'roster') { roster = Array.isArray(d.students) ? d.students : []; tablo = d.tablo || {}; emit(); }
  });
  post({ type: 'hello' });
})();
</script>

<style>
/* «Ничья из шляпы» — a magician's evening: velvet, gold, marquee bulbs, playing cards, stardust */

  --gold: #b07f16;

  --mint-soft: rgba(35, 119, 75, .14);

  --f-head: 'Yeseva One', 'Georgia', serif;

}

    --card: #fbf2e0; --card-2: #f0e1c6; --ink: #2a1426; --muted: #6e5562;
    --line: rgba(42, 20, 38, .14); --line-2: rgba(42, 20, 38, .3);
    --page-ink: #f5e7cf; --page-muted: #c2a9b8; --page-line: rgba(245, 231, 207, .16); --page-line-2: rgba(245, 231, 207, .32);

    --sq-l: #f1dfbf; --sq-d: #93424f; --frame: #0d0410;
    --shadow: 0 26px 46px -22px rgba(0, 0, 0, .9);

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14081a; --bg-2: #1e0d26; --velvet: #5e0f22; --velvet-2: #3d0816;
  --card: #fbf2e0; --card-2: #f0e1c6; --ink: #2a1426; --muted: #6e5562;
  --line: rgba(42, 20, 38, .14); --line-2: rgba(42, 20, 38, .3);
  --page-ink: #f5e7cf; --page-muted: #c2a9b8; --page-line: rgba(245, 231, 207, .16); --page-line-2: rgba(245, 231, 207, .32);

}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

  margin: 0; color: var(--page-ink, var(--ink)); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;

}

/* stardust layer */
.dust { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, var(--gold-hi), transparent 60%),

    radial-gradient(1.2px 1.2px at 86% 62%, var(--gold-hi), transparent 60%),

  animation: twinkle 4.5s ease-in-out infinite alternate; }
.dust.b { background-position: 40px 70px; animation-delay: -2.2s; animation-duration: 5.5s; }
@keyframes twinkle { from { opacity: .15; } to { opacity: .7; } }

/* top drape */
.drape { position: fixed; left: 0; right: 0; top: 0; height: 26px; z-index: 30; pointer-events: none;
  background: radial-gradient(18px 16px at 18px 0, var(--velvet) 15px, transparent 16px) 0 0 / 36px 26px repeat-x;
  filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .25)); }
.drape::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(var(--velvet-2), var(--velvet)); }
.fringe { position: fixed; left: 0; right: 0; top: 0; height: 32px; z-index: 29; pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--gold-hi) 0 2px, transparent 2px 6px); -webkit-mask: linear-gradient(transparent 22px, #000 22px 30px, transparent 30px); mask: linear-gradient(transparent 22px, #000 22px 30px, transparent 30px); opacity: .8; }

#app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); padding: 26px 16px 0; }

/* ---------- opening curtain ---------- */
.curtain { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; grid-template-columns: 1fr 1fr; }
.curtain i { display: block; height: 100%;
  background: radial-gradient(120% 60% at 50% 0%, rgba(255, 210, 140, .18), transparent 60%), repeating-linear-gradient(90deg, var(--velvet-2) 0 10px, var(--velvet) 22px, #b3283f 30px, var(--velvet) 40px, var(--velvet-2) 52px);
  box-shadow: inset 0 -30px 0 -18px var(--gold-hi); transition: transform 1.25s cubic-bezier(.7, 0, .25, 1); }
.curtain.open i:first-child { transform: translateX(-102%); }
.curtain.open i:last-child { transform: translateX(102%); }
.curtain .bill { position: absolute; left: 50%; top: 50%; translate: -50% -50%; text-align: center; color: #fbe9c4; font-family: var(--f-show); font-size: clamp(30px, 6vw, 70px); letter-spacing: .04em; text-shadow: 0 3px 0 rgba(0, 0, 0, .35); transition: opacity .4s; white-space: nowrap; }
.curtain .bill small { display: block; font-family: var(--f-head); font-size: .32em; letter-spacing: .2em; opacity: .85; }
.curtain.open .bill { opacity: 0; }
.curtain.gone { display: none; }

/* ---------- header ---------- */
.bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { width: 44px; height: 44px; flex: none; }
.logo b { font-family: var(--f-show); font-weight: 400; font-size: 26px; letter-spacing: .03em; line-height: 1; color: var(--page-ink, var(--crimson)); }
.logo span { display: block; font-size: 13px; color: var(--page-muted, var(--muted)); letter-spacing: .04em; font-weight: 700; text-transform: uppercase; margin-top: 3px; }
.tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; align-items: center; padding: 4px 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; }
.tabs > :last-child { margin-right: auto; }
.tabs button { flex: none; height: 38px; min-width: 38px; border: 1.5px solid var(--page-line-2, var(--line-2)); background: transparent; border-radius: 19px; padding: 0 12px; cursor: pointer; font-family: var(--f-head); font-size: 17px; color: var(--page-muted, var(--muted)); display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.tabs button .tl { font-family: var(--f-body); font-weight: 800; font-size: 14px; display: none; }
.tabs button .lv { display: inline-flex; gap: 1px; }
.tabs button .lv i { width: 7px; height: 7px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); background: var(--page-line-2, var(--line-2)); }
.tabs button .lv i.on { background: var(--gold-hi); }
.tabs button:hover { color: var(--page-ink, var(--ink)); border-color: var(--gold-hi); }
.tabs button[aria-current="true"] { background: var(--crimson); color: #fff6e6; border-color: var(--crimson); box-shadow: 0 0 0 3px rgba(242, 198, 90, .35); }
.tabs button[aria-current="true"] .tl { display: inline; }
.tools { display: flex; align-items: center; gap: 8px; }

.stars.bump svg { animation: spin .7s cubic-bezier(.2, 1.4, .4, 1); }

.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--page-line-2, var(--line-2)); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--page-muted, var(--muted)); }

/* ---------- stage ---------- */
.stage { --bs: min(calc(100vh - var(--bar) - 130px), 52vw, 640px); display: grid; grid-template-columns: var(--bs) minmax(300px, 450px); justify-content: center; align-items: center; gap: 34px; padding-block: 24px 22px; min-height: 0; position: relative; }
.board-col { width: var(--bs); display: flex; flex-direction: column; gap: 12px; }
.board-frame { width: 100%; aspect-ratio: 1; padding: 22px; position: relative; border-radius: 14px; box-shadow: var(--shadow), 0 0 0 2px var(--gold), inset 0 0 0 2px rgba(242, 198, 90, .35);
  background: linear-gradient(145deg, #3a1436, var(--frame) 60%); }
.board-frame::before, .board-frame::after { content: ""; position: absolute; inset: 6px; border-radius: 10px; pointer-events: none;
  --bulb: radial-gradient(circle, #fff6d2 0 2.4px, rgba(255, 210, 110, .75) 3.2px, rgba(255, 190, 80, 0) 6px);
  background: var(--bulb) 0 0 / 22px 12px repeat-x, var(--bulb) 0 100% / 22px 12px repeat-x, var(--bulb) 0 0 / 12px 22px repeat-y, var(--bulb) 100% 0 / 12px 22px repeat-y; }
.board-frame::after { background-position: 11px 0, 11px 100%, 0 11px, 100% 11px; animation: chase 1.1s steps(1) infinite; }
.board-frame::before { animation: chase 1.1s steps(1) infinite reverse; }
@keyframes chase { 0% { opacity: 1; } 50% { opacity: .18; } }
.board-frame.party::before, .board-frame.party::after { animation-duration: .28s; }
.board { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; background: var(--sq-l); border-radius: 3px; }
.sq { position: relative; display: grid; place-items: center; }
.sq.l { background: var(--sq-l); }
.sq.d { background: var(--sq-d); }
.board.clicky .sq { cursor: pointer; }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq[data-mark]:not([data-mark=""])::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(255, 214, 102, .42); }
.sq.sel::before { background: rgba(90, 45, 130, .4); }
.sq.check::before { background: radial-gradient(circle, rgba(230, 30, 50, .8), rgba(230, 30, 50, 0) 72%); }
.sq[data-mark="x"]::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; font-weight: 800; font-size: clamp(16px, 3.4vmin, 30px); color: #b3203a; text-shadow: 0 0 6px #fff; animation: xin .35s cubic-bezier(.2, 1.5, .4, 1) backwards; animation-delay: calc(var(--i, 0) * 90ms); pointer-events: none; }
.sq[data-mark="xi"]::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; font-weight: 800; font-size: clamp(16px, 3.4vmin, 30px); color: #1f74a3; text-shadow: 0 0 6px #fff; animation: xin .35s cubic-bezier(.2, 1.5, .4, 1) backwards; animation-delay: calc(var(--i, 0) * 90ms); pointer-events: none; }
@keyframes xin { from { transform: scale(2.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sq[data-mark="frozen"]::before { background: radial-gradient(circle, rgba(120, 210, 255, .9), rgba(120, 210, 255, 0) 72%); animation: frost 1.4s ease-in-out infinite alternate; }
.sq[data-mark="mated"]::before { background: radial-gradient(circle, rgba(230, 30, 50, .9), rgba(230, 30, 50, 0) 72%); }
@keyframes frost { from { filter: brightness(1); } to { filter: brightness(1.35) saturate(1.3); } }
.sq[data-mark="pick"]::before { box-shadow: inset 0 0 0 4px var(--plum); }
.sq[data-mark="gold"]::before { box-shadow: inset 0 0 0 4px var(--gold-hi); background: rgba(242, 198, 90, .3); }
.sq[data-mark="beamd"]::before { background: rgba(90, 45, 130, .45); animation: xin2 .45s ease-out backwards; animation-delay: calc(var(--i, 0) * 28ms); }
.sq[data-mark="beaml"]::before { background: rgba(242, 198, 90, .55); animation: xin2 .45s ease-out backwards; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes xin2 { from { opacity: 0; } }
.sq[data-mark="corner"]::before { box-shadow: inset 0 0 0 5px var(--gold-hi); animation: cornerp 1s ease-in-out infinite alternate; }
@keyframes cornerp { to { box-shadow: inset 0 0 0 9px var(--gold-hi); } }
.sq.dot::after { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: rgba(42, 20, 38, .4); pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(42, 20, 38, .4); pointer-events: none; }
.co { position: absolute; font-size: clamp(9px, 1.15vmin, 12px); line-height: 1; pointer-events: none; z-index: 1; font-weight: 800; }
.sq.l .co { color: #a2525d; }
.sq.d .co { color: #f6e3c4; }
.co-r { top: 3px; left: 3px; }
.co-f { bottom: 2px; right: 3px; }
.pc { width: 90%; height: 90%; position: relative; z-index: 2; pointer-events: none; }
.pc.anim { transition: transform .24s cubic-bezier(.3, .7, .4, 1); }
.pc.lift { opacity: .3; }
.pc.pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
.pc.vanish { animation: vanish .6s ease-in forwards; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vanish { 40% { transform: scale(1.15) rotate(8deg); opacity: 1; } to { transform: scale(.1) rotate(-30deg) translateY(-30%); opacity: 0; } }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); }
.board .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.ov .beam { animation: beam .5s ease-out backwards; }
@keyframes beam { from { opacity: 0; } }
.board-frame.flash-bad { animation: fbad .6s; }
@keyframes fbad { 30% { box-shadow: 0 0 0 6px #b3203a, var(--shadow); } }
.board-frame.flash-ok { animation: fok .8s; }
@keyframes fok { 30% { box-shadow: 0 0 0 6px var(--gold-hi), var(--shadow); } }
.promo { position: absolute; inset: 0; z-index: 5; background: rgba(20, 6, 22, .62); display: grid; place-items: center; }
.promo-box { display: flex; gap: 8px; padding: 10px; }
.promo-box button { width: 64px; height: 92px; border: 2px solid var(--gold-hi); background: linear-gradient(#fffaf0, #f2e2c4); border-radius: 8px; cursor: pointer; box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .7); animation: dealin .35s cubic-bezier(.2, 1.3, .4, 1) backwards; transition: transform .15s; }
.promo-box button:nth-child(2) { animation-delay: .06s; }
.promo-box button:nth-child(3) { animation-delay: .12s; }
.promo-box button:nth-child(4) { animation-delay: .18s; }
.promo-box button:hover { transform: translateY(-6px) rotate(-2deg); }
.promo-box svg { width: 100%; height: 70%; }
@keyframes dealin { from { transform: translateY(40px) rotate(10deg); opacity: 0; } }

/* smoke puff and stardust */
.puff { position: fixed; z-index: 85; pointer-events: none; width: 10px; height: 10px; translate: -50% -50%; }
.puff i { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, .95), rgba(214, 200, 228, .8) 45%, rgba(160, 140, 190, 0) 72%); animation: puff .9s ease-out forwards; animation-delay: var(--d); }
@keyframes puff { from { transform: translate(0, 0) scale(.2); opacity: .95; } to { transform: translate(var(--x), var(--y)) scale(1.4); opacity: 0; } }
#sparkle { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* bulbs under the board: move list */
.marquee { position: relative; height: 40px; margin-inline: 8px; border-radius: 20px; background: linear-gradient(#3a1436, #22091f); border: 1.5px solid var(--gold); display: flex; align-items: center; overflow: hidden; padding-inline: 16px; font-size: 15px; color: #fbe9c4; white-space: nowrap; box-shadow: inset 0 0 12px rgba(0, 0, 0, .6); }
.marquee .tm { display: flex; gap: 11px; margin-left: auto; }
.marquee .n { color: #d9a441; margin-right: 2px; }
.marquee .lead { font-family: var(--f-head); color: var(--gold-hi); letter-spacing: .06em; font-size: 14px; }

/* ---------- card (playbill) ---------- */
.card { position: relative; background: var(--card); color: var(--ink); padding: 30px 26px 22px; box-shadow: var(--shadow), 0 0 0 1px var(--gold), 0 0 0 7px var(--card), 0 0 0 8px var(--gold); display: flex; flex-direction: column; gap: 14px; min-width: 0; border-radius: 4px; margin: 8px; }
.card > * { animation: rise .45s cubic-bezier(.2, .9, .3, 1) backwards; }
.card > :nth-child(2) { animation-delay: .05s; }
.card > :nth-child(3) { animation-delay: .1s; }
.card > :nth-child(4) { animation-delay: .15s; }
.card > :nth-child(n+5) { animation-delay: .2s; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.card .corner { position: absolute; width: 22px; height: 22px; color: var(--gold); }
.card .corner.tl { left: 6px; top: 6px; }
.card .corner.tr { right: 6px; top: 6px; transform: scaleX(-1); }
.card .corner.bl { left: 6px; bottom: 6px; transform: scaleY(-1); }
.card .corner.br { right: 6px; bottom: 6px; transform: scale(-1); }
.kicker { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.kicker b { color: var(--crimson); font-weight: 800; }
.title { font-family: var(--f-head); font-size: clamp(30px, 2.8vw, 40px); line-height: 1.04; color: var(--crimson); }
.task { font-size: 17px; line-height: 1.45; }
.task b { color: var(--crimson); }
.note { border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; color: var(--muted); font-size: 16px; }
.note b { color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 9px 17px; border-radius: 22px; cursor: pointer; font-weight: 800; font-size: 15px; line-height: 1.1; transition: background .15s, color .15s, transform .1s, box-shadow .15s; }
.btn:hover { background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--crimson); border-color: var(--crimson); color: #fff6e6; box-shadow: 0 6px 14px -8px rgba(179, 32, 58, .9); }
.btn.primary:hover { background: #8f1b2f; }
.btn.hint { border-style: dashed; color: var(--plum); border-color: var(--plum); }
.btn.big { padding: 13px 24px; font-size: 16px; }
.btn.armed { background: var(--crimson); border-color: var(--crimson); color: #fff; }
.fb { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card-2); border-radius: 8px; font-size: 16px; }
.fb:empty { background: transparent; min-height: 0; padding: 0; }
.fb[data-type="ok"] { background: var(--mint-soft); }
.fb[data-type="bad"] { background: var(--crimson-soft); }
.fb[data-type="warn"] { background: var(--plum-soft); }
.fb[data-type="info"] { background: var(--ice-soft); }
.fb-mark { flex: none; width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; font-weight: 800; border: 1.5px solid currentColor; border-radius: 50%; }
.fb[data-type="ok"] .fb-mark { color: var(--mint); }
.fb[data-type="bad"] .fb-mark { color: var(--crimson); }
.fb[data-type="warn"] .fb-mark { color: var(--plum); }
.fb[data-type="info"] .fb-mark { color: var(--ice); }
.fb b { color: var(--crimson); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.pips { display: flex; gap: 6px; }
.pips i { width: 14px; height: 14px; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); background: var(--line-2); }
.pips i.done { background: var(--gold); }
.pips i.miss { background: var(--crimson); }
.pips i.now { background: var(--ink); }

/* fact card (flip) */
.fact { perspective: 900px; }
.fact button { width: 100%; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
.fact .inner { position: relative; display: grid; transition: transform .6s cubic-bezier(.3, .8, .3, 1); transform-style: preserve-3d; }
.fact.open .inner { transform: rotateY(180deg); }
.fact .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; padding: 12px 14px; }
.fact .front { background: radial-gradient(circle at 18px 50%, rgba(242, 198, 90, .35), transparent 40px), repeating-linear-gradient(45deg, #9c1a31 0 6px, #ad2139 6px 12px); color: #fff6e6; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 0 0 2px var(--gold-hi), inset 0 0 0 5px #9c1a31, inset 0 0 0 6px rgba(242, 198, 90, .5); min-height: 56px; }
.fact .front svg { width: 30px; height: 30px; flex: none; color: var(--gold-hi); }
.fact .front b { font-family: var(--f-head); font-weight: 400; font-size: 19px; }
.fact .front span { font-size: 13px; opacity: .85; display: block; }
.fact .back { transform: rotateY(180deg); background: var(--card-2); border: 1.5px solid var(--gold); font-size: 14px; line-height: 1.4; }
.fact .back b { color: var(--crimson); }

/* playing-card answers */
.deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.deck.two { grid-template-columns: 1fr 1fr; }
.pcard { position: relative; aspect-ratio: 5 / 6.4; border-radius: 10px; border: 1.5px solid var(--line-2); background: linear-gradient(#fffdf8, #f6ead6); cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; padding: 8px 4px; box-shadow: 0 10px 18px -14px rgba(42, 20, 38, .8); transition: transform .18s cubic-bezier(.2, 1.4, .4, 1), box-shadow .18s; }
.pcard:hover { transform: translateY(-5px) rotate(-1.5deg); box-shadow: 0 16px 22px -14px rgba(42, 20, 38, .8); }
.pcard .suit { font-size: 34px; line-height: 1; }
.pcard .lbl { font-family: var(--f-head); font-size: 19px; line-height: 1.05; text-align: center; }
.pcard small { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; }
.pcard .pip { position: absolute; font-size: 13px; font-weight: 800; line-height: 1; }
.pcard .pip.a { left: 7px; top: 6px; }
.pcard .pip.b { right: 7px; bottom: 6px; transform: rotate(180deg); }
.pcard.red { color: var(--crimson); }
.pcard.blk { color: var(--ink); }
.pcard.ice { color: var(--ice); }
.pcard.right { background: linear-gradient(#f2fff6, #d7f1e0); border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); animation: cardwin .6s cubic-bezier(.2, 1.4, .4, 1); }
.pcard.wrong { background: var(--crimson-soft); border-color: var(--crimson); animation: shake .35s; }
.pcard.dim { opacity: .45; }

.pcard:disabled:hover { transform: none; }
@keyframes cardwin { 40% { transform: translateY(-10px) rotateY(180deg) scale(1.04); } to { transform: none; } }
.deck.two .pcard { aspect-ratio: auto; min-height: 88px; }

/* epoch cards (time machine) */
.epochs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.epoch { perspective: 800px; }
.epoch .inner { position: relative; display: grid; transition: transform .6s cubic-bezier(.3, .8, .3, 1); transform-style: preserve-3d; }
.epoch.open .inner { transform: rotateY(180deg); }
.epoch .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; padding: 7px 10px; min-height: 70px; display: grid; gap: 4px; align-content: start; }
.epoch .front { background: var(--card-2); border: 1.5px solid var(--line-2); }
.epoch .front b { font-family: var(--f-head); font-weight: 400; font-size: 16px; color: var(--crimson); line-height: 1.05; }
.epoch .front .opts { display: flex; flex-wrap: wrap; gap: 4px; }
.epoch .front .opts button { border: 1px solid var(--line-2); background: var(--card); border-radius: 12px; padding: 3px 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.epoch .front .opts button:hover { border-color: var(--crimson); color: var(--crimson); }
.epoch .back { transform: rotateY(180deg); background: var(--ink); color: #fbe9c4; font-size: 13px; line-height: 1.32; display: block; }
.epoch .back b { font-family: var(--f-head); font-weight: 400; font-size: 16px; color: var(--gold-hi); display: block; margin-bottom: 2px; }
.epoch .back.ok { box-shadow: inset 0 0 0 3px #3fb47a; }
.epoch .back.no { box-shadow: inset 0 0 0 3px #e0485c; }

/* program (prologue) */
.program { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; counter-reset: n; }
.program li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; font-size: 15px; border-bottom: 1px dotted var(--line-2); padding: 3px 0; }
.program li::before { counter-increment: n; content: counter(n); font-family: var(--f-head); color: var(--gold); font-size: 17px; }
.program li span { color: var(--muted); font-size: 13px; }
.tricks { display: flex; gap: 8px; flex-wrap: wrap; }
.prog { display: flex; flex-wrap: wrap; gap: 5px; }
.prog span { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.prog span i { font-style: normal; color: var(--gold); margin-right: 4px; font-family: var(--f-head); }

/* juggler (perpetual) */
.juggler { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-radius: 10px; background: var(--card-2); }
.juggler svg { width: 78px; height: 70px; flex: none; overflow: visible; }
.juggler .ball { transform-box: view-box; opacity: 0; }
.juggler.on .ball { opacity: 1; }
.juggler.on .ball { animation: juggle 1.1s linear infinite; }
.juggler.on .ball:nth-of-type(2) { animation-delay: -.37s; }
.juggler.on .ball:nth-of-type(3) { animation-delay: -.73s; }
@keyframes juggle { 0% { transform: translate(-8px, 0); opacity: 0; } 10% { opacity: 1; } 30% { transform: translate(-18px, -36px); } 50% { transform: translate(0, -46px); } 70% { transform: translate(18px, -36px); } 90% { opacity: 1; } 100% { transform: translate(8px, 0); opacity: 0; } }
.juggler .lamps { display: flex; gap: 6px; }
.juggler .lamps i { width: 16px; height: 16px; border-radius: 50%; background: var(--line-2); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15); transition: background .3s, box-shadow .3s; }
.juggler .lamps i.on { background: var(--gold-hi); box-shadow: 0 0 10px var(--gold-hi); }
.juggler p { font-size: 14px; color: var(--muted); }
.juggler p b { color: var(--ink); font-family: var(--f-head); font-weight: 400; font-size: 17px; display: block; }

/* hat & rabbit finish */
.finale { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.hat { width: 96px; height: 110px; overflow: visible; }
.hat .rabbit { animation: rabbit 1s .35s cubic-bezier(.2, 1.5, .4, 1) backwards; }
@keyframes rabbit { from { transform: translateY(46px); } }
.hat .wand { transform-origin: 78px 20px; animation: wand .9s ease-in-out 2; }
@keyframes wand { 50% { transform: rotate(-24deg); } }
.starrow { display: flex; gap: 8px; }
.starrow svg { width: 44px; height: 44px; color: var(--gold-hi); filter: drop-shadow(0 2px 2px rgba(120, 70, 0, .35)); animation: starin .5s cubic-bezier(.2, 1.5, .5, 1) backwards; }
.starrow svg:nth-child(2) { animation-delay: .14s; }
.starrow svg:nth-child(3) { animation-delay: .28s; }
.starrow svg.off { color: var(--line-2); filter: none; }
@keyframes starin { from { transform: scale(.2) rotate(-120deg); opacity: 0; } }

  background: radial-gradient(circle at 50% 30%, #c4314b, #7a1024); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 7px rgba(122, 16, 36, .85), 0 20px 40px -10px rgba(0, 0, 0, .7); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); animation: sealin .5s cubic-bezier(.2, 1.4, .4, 1), sealfade .8s 2.6s forwards; }
.seal.ice { background: radial-gradient(circle at 50% 30%, #3a9ccc, #135778); }
.seal.mint { background: radial-gradient(circle at 50% 30%, #35a36a, #145233); }
.seal small { display: block; font-family: var(--f-body); font-weight: 800; font-size: .26em; letter-spacing: .12em; text-transform: uppercase; opacity: .9; text-align: center; }
@keyframes sealin { from { transform: scale(2) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sealfade { to { opacity: .12; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 14px; background: var(--card-2); }
.links { display: grid; gap: 6px; }
.links a, .links button { display: grid; gap: 1px; padding: 8px 16px; border: 1.5px solid var(--line-2); border-radius: 20px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 15px; background: transparent; cursor: pointer; text-align: left; }
.links a span, .links button span { color: var(--muted); font-weight: 600; font-size: 13px; }
.links a:hover, .links button:hover { border-color: var(--crimson); }
.recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.recap li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; align-items: start; }
.recap li i { font-style: normal; font-size: 20px; line-height: 1; text-align: center; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 95; background: var(--card); color: var(--ink); border-left: 3px solid var(--gold); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px; overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; font-size: 16px; }
.drawer.open { transform: none; }
.drawer h3 { font-family: var(--f-head); font-size: 26px; margin-bottom: 10px; color: var(--crimson); }
.drawer ul { padding-left: 18px; margin: 0; display: grid; gap: 8px; color: var(--muted); }

<script>
/* Mini chess core: legal moves, SAN (EN/RU), FEN. Written for this lesson page. */
(function (root) {
  'use strict';
  var FILES = 'abcdefgh';
  var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  function on(f, r) { return f >= 0 && f < 8 && r >= 0 && r < 8; }

  function Position(fen) { this.load(fen || START); }
  Position.prototype.load = function (fen) {
    var parts = fen.trim().split(/\s+/);
    var rows = parts[0].split('/');
    if (rows.length !== 8) throw new Error('Bad FEN: ' + fen);
    this.board = new Array(64).fill('');
    for (var r = 0; r < 8; r++) {
      var f = 0;
      for (var k = 0; k < rows[r].length; k++) {
        var ch = rows[r][k];
        if (ch >= '1' && ch <= '8') f += +ch;
        else { this.board[(7 - r) * 8 + f] = ch; f++; }
      }
      if (f !== 8) throw new Error('Bad FEN row: ' + rows[r]);
    }

    if (att) { marks[sqName(s)] = kind === 'mate' ? 'x' : 'xi'; board.sqEls[s].style.setProperty('--i', ++n); }
  }
  board.marks = marks; board.render();
}

/* autoplay a SAN line from fen; cb() at the end */
function demoLine(fen, sans, cb, opts) {
  opts = opts || {};
  const p = new Position(fen); board.set(p); board.arrows = []; board.layers = null;
  const shown = []; tape(shown, fen);
  const my = ++demoGen; let k = 0;
  const step = () => {
    if (my !== demoGen) return;
    if (k >= sans.length) { if (cb) cb(); return; }
    const r = board.play(sans[k]); if (!r) { if (cb) cb(); return; }
    shown.push(r.san); tape(shown, fen); k++;
    if (opts.onPly) opts.onPly(k, r.san);
    later(step, opts.delay || 650);
  };
  later(step, opts.first || 450);
}

/* ---------- verified move-graph player: student moves, computer replies ---------- */
function makeGraph(o) {
  // o: { task:{fen, side, G}, onDone(kind, stats), onStep(k, san), onReply(k, san), badText(san, refSan, u), eqText(san), badDemo:{uci:[san..]}, limitKind }
  const T = o.task, G = T.G;
  let pos, sans, busy, over, gen = 0, counts, k; let mistakes = 0, hints = 0;
  const showTape = () => tape(sans, T.fen);
  function reset() {
    gen++; demoGen++;
    pos = new Position(T.fen); sans = []; busy = false; over = false; counts = {}; counts[keyOf(pos)] = 1; k = 0;
    board.setOrient(T.side); board.set(pos); board.layers = null; board.arrows = []; board.render(); showTape(); clearSeal();
  }
  reset();
  function bump() { const key = keyOf(pos); counts[key] = (counts[key] || 0) + 1; return counts[key]; }
  function done(kind) {
    over = true;
    if (kind === 'stalemate') { showWhy(pos, 'stalemate'); seal('ПАТ!', 'ice', 'ничья'); Sound.freeze(); }
    else if (kind === 'mate') { showWhy(pos, 'mate'); seal('МАТ!', '', 'фокус удался'); }
    else if (kind === 'repetition') { seal('НИЧЬЯ', 'mint', 'троекратное повторение'); }
    else if (o.limitSeal) seal(o.limitSeal[0], o.limitSeal[1] || 'mint', o.limitSeal[2]);
    flash($('#frame'), 'ok'); Sound.magic();
    o.onDone(kind, { mistakes, hints, sans });
  }
  board.canMove = () => !busy && !over && pos.turn === T.side;
  board.onMove = mv => {
    const prev = pos.fen(), key = keyOf(pos), nd = G[key];
    const r = board.play(mv); if (!r) return;
    const u = uciOf(r.m);
    if (nd && u in nd.g) {
      sans.push(r.san); showTape(); board.arrows = []; board.marks = {}; board.render(); Sound.ok(); k++;
      if (o.onStep) o.onStep(k, r.san, pos);
      const st = pos.status();
      if (st === 'mate' || st === 'stalemate') { done(st); return; }
      if (bump() >= 3) { done('repetition'); return; }
      const rep = nd.g[u];
      if (!rep) { done('limit'); return; }
      busy = true; const g0 = gen;
      later(() => {
        if (g0 !== gen) return;
        const rr = board.play(sqFromU(rep)); sans.push(rr.san); showTape(); busy = false;
        if (o.onReply) o.onReply(k, rr.san, pos);
        const st2 = pos.status();
        if (st2 === 'stalemate' || st2 === 'mate') { done(st2); return; }
        if (bump() >= 3) { done('repetition'); return; }
        if (!G[keyOf(pos)]) done('limit');
      }, 700);
      return;
    }
    busy = true; const g1 = gen;
    const back = ms => later(() => { if (g1 !== gen) return; pos = new Position(prev); board.set(pos); board.arrows = []; board.marks = {}; board.render(); clearSeal(); busy = false; }, ms);
    if (nd && nd.e.includes(u)) { Sound.tick(); say('warn', o.eqText ? o.eqText(r.san) : `${esc(ru(r.san))} — тоже неплохо, но мы ищем другой ход.`); back(1600); return; }
    mistakes++; Sound.bad(); flash($('#frame'), 'bad');
    const st = pos.status();
    if (st === 'stalemate') {
      showWhy(pos, 'stalemate'); seal('ПАТ', 'ice', 'фокус соперника'); Sound.freeze();
      say('bad', o.stalemateText ? o.stalemateText(r.san) : `${esc(ru(r.san))}?? Это пат — ничья! Королю некуда ходить, а шаха нет.`);
      back(2600); return;
    }
    if (o.badDemo && o.badDemo[u]) {
      const seq = o.badDemo[u]; let j = 0;
      say('bad', o.badDemoText ? o.badDemoText(r.san) : `${esc(ru(r.san))}? Смотрите, что будет…`);
      const stepD = () => {
        if (g1 !== gen) return;
        if (j >= seq.length) {
          const s3 = pos.status();
          if (s3 === 'stalemate') { showWhy(pos, 'stalemate'); seal('ПАТ', 'ice', 'фокус соперника'); Sound.freeze(); }
          back(2600); return;
        }
        board.play(seq[j++]); later(stepD, 800);
      };
      later(stepD, 700); return;
    }
    const ref = nd && nd.b[u]; let refSan = '';
    if (ref) { const m2 = pos.findMove(sqFromU(ref)); if (m2) { refSan = pos.san(m2); board.arrows = [{ from: m2.from, to: m2.to, color: 'var(--crimson)' }]; board.render(); } }
    say('bad', o.badText ? o.badText(r.san, refSan, u) : `${esc(ru(r.san))}? ${refSan ? `Ответ <b>${esc(ru(refSan))}</b> — и фокус не удался.` : 'Так не выйдет.'}`);
    back(1900);
  };
  return {
    reset,
    hint() {
      if (busy || over) return false; const nd = G[keyOf(pos)]; if (!nd) return false;
      const u = o.hintMove ? o.hintMove(nd, k) : Object.keys(nd.g)[0]; if (!u) return false;
      hints++; board.arrows = [{ from: sqIndex(u.slice(0, 2)), to: sqIndex(u.slice(2, 4)), color: 'var(--plum)' }]; board.render(); Sound.reveal(); return true;
    },
    stats: () => ({ mistakes, hints }),
    pos: () => pos
  };
}

/* shared: rounds of graph tasks */
function roundsChapter(ch, rounds, cfg) {
  let i, res, errs, L;
  function show() {
    const r = rounds[i];
    card.innerHTML = head(cfg.kicker, pips(rounds.length, i, res), r.title, r.text) +
      (r.extra || '') + `<div class="fb" id="fb"></div><div class="controls" id="ctl"></div>` + (r.fact ? factHtml(r.fact[0], r.fact[1], r.fact[2]) : '');
    ctl(Bt('hintB', 'Подсказка', 'hint') + Bt('rsB', 'Заново'));
    on('hintB', () => { if (L.hint()) say('warn', 'Стрелка показывает ход фокусника.'); });
    on('rsB', () => { L.reset(); say(); if (r.onReset) r.onReset(); });
    if (r.onShow) r.onShow();
    L = makeGraph(Object.assign({}, r.opts || {}, {
      task: r.task,
      onStep(k, san, pos) { const t = r.steps && r.steps[k - 1]; if (t) say('ok', t); else say(); if (r.onStep) r.onStep(k, san, pos); },
      onReply(k, san, pos) { if (r.onReply) r.onReply(k, san, pos); },
      onDone(kind, st) {
        const e = st.mistakes + st.hints; errs += e; res[i] = e === 0;
        card.querySelector('.kicker b').innerHTML = pips(rounds.length, i, res);
        if (r.onDoneHook) r.onDoneHook(kind);
        say('ok', (r.done && (r.done[kind] || r.done.any)) || 'Фокус удался!');
        const last = i === rounds.length - 1;
        ctl(Bt('nx', last ? 'Итог номера →' : 'Следующий фокус →', 'primary'));
        on('nx', () => { clearSeal(); if (last) finish(); else { i++; show(); } });
      }
    }));
  }
  function finish() { card.innerHTML = head(cfg.kicker, '', cfg.doneTitle, '') + finishCard(ch, scoreBy(errs), cfg.doneLine); }
  return { enter() { i = 0; res = []; errs = 0; show(); } };
}

/* 4 — perpetual motion */
const jug = `<div class="juggler" id="jug"><svg viewBox="-40 -54 80 72" aria-hidden="true"><circle class="ball" cx="0" cy="-4" r="5.5" fill="#e0485c"/><circle class="ball" cx="0" cy="-4" r="5.5" fill="#f2c65a"/><circle class="ball" cx="0" cy="-4" r="5.5" fill="#7fd0f0"/><path d="M-13 -2 L-11 14 Q0 17 11 14 L13 -2 Z" fill="#2b1028"/><path d="M-12.2 7 Q0 10 12.2 7 L11.6 11 Q0 14 -11.6 11 Z" fill="#b3203a"/><ellipse cx="0" cy="-2" rx="19" ry="4.5" fill="#3a1436"/></svg><div><p><b id="jugN">Шахов: 0</b>повторения позиции</p><div class="lamps"><i></i><i></i><i></i></div></div></div>`;
function jugUpdate(checks, rep) {
  const n = $('#jugN'); if (!n) return;
  n.textContent = 'Шахов: ' + checks;
  $$('#jug .lamps i').forEach((l, k) => l.classList.toggle('on', k < rep));
  $('#jug').classList.toggle('on', checks > 0);
}
function perpetualRound(o) {
  let checks = 0, seen = {};
  const top = () => Math.max(0, ...Object.values(seen));
  const reset = () => { checks = 0; seen = {}; jugUpdate(0, 0); };
  const mark = pos => { const key = keyOf(pos); seen[key] = (seen[key] || 0) + 1; };
  return Object.assign(o, {
    extra: jug,
    onShow: reset, onReset: reset,
    onStep(k, san, pos) { if (san.includes('+')) { checks++; Sound.toss(); } mark(pos); jugUpdate(checks, top()); },
    onReply(k, san, pos) { mark(pos); jugUpdate(checks, top()); },
    onDoneHook() { const j = $('#jug'); if (j) { j.classList.add('on'); $$('#jug .lamps i').forEach(l => l.classList.add('on')); } }
  });
}
