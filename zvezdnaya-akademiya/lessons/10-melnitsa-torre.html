<script>
/* Academy bridge: lets a lesson running inside «Звёздная академия» report stars per student.
   Standalone (no academy) the lesson behaves exactly as before: window.Academy.on === false. */
(function () {
  var L = 'L10';
  var embed = false;
  try { embed = !!window.ACADEMY_EMBED || /[?&]academy=1/.test(location.search); } catch (e) { embed = false; }
  if (embed && window.parent === window) embed = false;
  var roster = [], tablo = {}, subs = [];
  function post(m) { m.__academy = 1; m.lesson = L; try { window.parent.postMessage(m, '*'); } catch (e) { /* parent unreachable */ } }
  function emit() { subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener error */ } }); }
  var A = {
    on: embed,
    lesson: L,
    roster: function () { return roster; },
    tablo: function () { return tablo; },
    onRoster: function (f) { subs.push(f); },
    /* key: chapter id for 'best' (keeps the student's best result), or null for 'add' (adds up) */
    reward: function (key, n, label, mode) {
      if (!embed) return;
      n = Math.round(+n || 0); if (n <= 0) return;
      post({ type: 'reward', key: key, n: n, label: String(label || ''), mode: mode || 'best' });
    },
    points: function (id, d) {
      if (!embed) return;
      var was = tablo[id] || 0, now = Math.max(0, was + (Math.round(+d) || 0));
      if (now === was) return;
      tablo[id] = now; emit();
      post({ type: 'points', student: id, d: now - was });
    },
    addStudent: function (name) { if (embed) post({ type: 'add-student', name: String(name || '').slice(0, 40) }); },
    rename: function (id, name) { if (embed) post({ type: 'rename', student: id, name: String(name || '').slice(0, 40) }); },
    download: function (filename, data) { if (embed) post({ type: 'download', filename: filename, data: data }); },
    scores: function () {
      return {
        list: function () { return roster.map(function (s) { return { id: s.id, n: s.name, s: tablo[s.id] || 0 }; }); },
        sorted: function () { return this.list().sort(function (a, b) { return b.s - a.s; }); },
        isExample: function () { return false; },
        add: function (n) { A.addStudent(n); },
        inc: function (id, d) { A.points(id, d); },
        rename: function (id, n) { var r = roster.find(function (x) { return x.id === id; }); if (r) r.name = n; A.rename(id, n); },
        remove: function () {}, zero: function () {}, clear: function () {},
        on: function (f) { subs.push(function () { f(); }); }
      };
    }
  };
  window.Academy = A;
  if (!embed) return;
  document.documentElement.classList.add('academy');
  var st = document.createElement('style');
  st.textContent = '.academy #sc-zero,.academy #sc-clear,.academy .sc-row .x{display:none!important}.academy .sc-row{grid-template-columns:22px 1fr auto auto auto!important}';
  (document.head || document.documentElement).appendChild(st);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.__academy || e.source !== window.parent) return;
    if (d.type === 'roster') { roster = Array.isArray(d.students) ? d.students : []; tablo = d.tablo || {}; emit(); }
  });
  post({ type: 'hello' });
})();
</script>

<style>
/* «Мельница Торре» — a windmill on a summer day: sky, wheat field, linen flour sacks, a wooden board, red ink stamps */

  --sq-d: #b4845a;
  --wood: #6b4427;

}

    --card: #f8f0dc; --card-2: #eee0bd; --ink: #2f2114; --muted: #6c5843;

    --sq-l: #ead9b4; --sq-d: #9a6c44; --wood: #4a2e18; --wood-2: #2c190c;

    --shadow: 0 26px 46px -22px rgba(0, 0, 0, .9);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sky-top: #08111f; --sky-low: #1b2a44; --field: #3a3220; --field-2: #2c2617; --meadow: #1f2d1e; --bg: #0d1626;
  --card: #f8f0dc; --card-2: #eee0bd; --ink: #2f2114; --muted: #6c5843;
  --page-ink: #f3ead2; --page-muted: #b9b29f; --page-line: rgba(243, 234, 210, .16); --page-line-2: rgba(243, 234, 210, .32);
  --sq-l: #ead9b4; --sq-d: #9a6c44; --wood: #4a2e18; --wood-2: #2c190c;

}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

  margin: 0; color: var(--page-ink, var(--ink)); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 62%, var(--field) 62.2%, var(--field-2) 100%) fixed, var(--bg);
}
button { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--wheat-hi); outline-offset: 2px; }

/* ---------- landscape: sun or moon, clouds or stars, hills, the big mill ---------- */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sun { position: absolute; left: 7vw; top: 9vh; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #fff6c9 0 38%, rgba(255, 222, 120, .55) 40%, rgba(255, 222, 120, 0) 70%); }

.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 92px; height: 92px; left: 34px; top: -44px; }
.cloud::after { width: 124px; height: 124px; left: 92px; top: -64px; }
.cloud.c1 { top: 12vh; left: -260px; }
.cloud.c2 { top: 26vh; left: -260px; transform: scale(.6); animation-duration: 130s; animation-delay: -60s; opacity: .6; }

  background-image:
    radial-gradient(1.4px 1.4px at 12% 22%, #fff, transparent 60%), radial-gradient(1.2px 1.2px at 32% 48%, #fff, transparent 60%),
    radial-gradient(1.6px 1.6px at 74% 18%, #fff, transparent 60%), radial-gradient(1.1px 1.1px at 86% 52%, #fff, transparent 60%),
    radial-gradient(1.3px 1.3px at 55% 30%, #fff, transparent 60%), radial-gradient(1.2px 1.2px at 6% 62%, #fff, transparent 60%),
    radial-gradient(1.5px 1.5px at 94% 8%, #fff, transparent 60%), radial-gradient(1.1px 1.1px at 44% 8%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 64%, #fff, transparent 60%), radial-gradient(1.4px 1.4px at 22% 78%, #fff, transparent 60%); }
.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40vh; }
.hills .h1 { fill: var(--meadow); opacity: .55; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sun { left: auto; right: 34vw; top: 8vh; width: 70px; height: 70px; background: radial-gradient(circle at 38% 38%, #fffbe8 0 52%, rgba(255, 251, 232, .25) 54%, rgba(255, 251, 232, 0) 72%); }
  :root:not([data-theme="light"]) .cloud { opacity: .07; }
  :root:not([data-theme="light"]) .stars-sky { opacity: .85; animation: twinkle 5s ease-in-out infinite alternate; }
  :root:not([data-theme="light"]) .bigmill .win { fill: #f6c75a; }
}
:root[data-theme="dark"] .sun { left: auto; right: 34vw; top: 8vh; width: 70px; height: 70px; background: radial-gradient(circle at 38% 38%, #fffbe8 0 52%, rgba(255, 251, 232, .25) 54%, rgba(255, 251, 232, 0) 72%); }
:root[data-theme="dark"] .cloud { opacity: .07; }
:root[data-theme="dark"] .stars-sky { opacity: .85; animation: twinkle 5s ease-in-out infinite alternate; }
:root[data-theme="dark"] .bigmill .win { fill: #f6c75a; }
@keyframes twinkle { from { opacity: .45; } to { opacity: .95; } }

#app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: var(--bar) minmax(0, 1fr); padding: 10px 16px 0; }

/* ---------- opening: the sails sweep the screen ---------- */
.intro { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(255, 246, 214, .96), rgba(243, 223, 170, .98) 60%, rgba(214, 170, 80, .98)); transition: opacity .7s ease .1s; }
.intro svg { position: absolute; width: min(150vmin, 1100px); height: min(150vmin, 1100px); animation: sweep 1.9s cubic-bezier(.5, 0, .3, 1) forwards; }
.intro .bill { position: relative; text-align: center; color: var(--brick-2); font-family: var(--f-head); font-weight: 800; font-size: clamp(36px, 7vw, 82px); line-height: 1; letter-spacing: .01em; text-shadow: 0 2px 0 #fff6dc, 0 0 30px #fff6dc; transition: opacity .35s; }
.intro .bill small { display: block; font-family: var(--f-body); font-weight: 800; font-size: .2em; letter-spacing: .3em; text-transform: uppercase; color: var(--wood); margin-bottom: .5em; }
.intro.open { opacity: 0; }
.intro.open .bill { opacity: 0; }
.intro.gone { display: none; }
@keyframes sweep { from { transform: rotate(-30deg) scale(.55); } to { transform: rotate(150deg) scale(1.7); } }

/* ---------- header ---------- */
.bar { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; }

.logo b { font-family: var(--f-head); font-weight: 800; font-size: 26px; letter-spacing: .01em; line-height: 1; color: var(--page-ink, var(--brick-2)); }
.logo span { display: block; font-size: 13px; color: var(--page-muted, var(--muted)); letter-spacing: .05em; font-weight: 800; text-transform: uppercase; margin-top: 3px; }
.tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; align-items: center; padding: 4px 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > :first-child { margin-left: auto; }
.tabs > :last-child { margin-right: auto; }
.tabs button { flex: none; height: 38px; min-width: 38px; border: 1.5px solid var(--page-line-2, var(--line-2)); background: rgba(255, 250, 236, .5); border-radius: 19px; padding: 0 12px; cursor: pointer; font-family: var(--f-head); font-weight: 800; font-size: 17px; color: var(--page-muted, var(--muted)); display: flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }

.tabs button .lv i.on { background: var(--wheat-hi); box-shadow: 0 0 0 1px rgba(120, 80, 10, .35); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button:not([aria-current="true"]) { background: rgba(13, 22, 38, .5); } }
:root[data-theme="dark"] .tabs button:not([aria-current="true"]) { background: rgba(13, 22, 38, .5); }
.tools { display: flex; align-items: center; gap: 8px; }
.stars { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; padding: 5px 12px 5px 8px; border: 1.5px solid var(--page-line-2, var(--line-2)); border-radius: 18px; white-space: nowrap; color: var(--page-muted, var(--muted)); background: rgba(255, 250, 236, .45); }
.stars svg { width: 22px; height: 22px; color: var(--wheat-hi); filter: drop-shadow(0 1px 0 rgba(120, 80, 10, .5)); }

:root[data-theme="dark"] .stars, :root[data-theme="dark"] .icon-btn { background: rgba(13, 22, 38, .5); }
.icon-btn:hover { color: var(--page-ink, var(--ink)); border-color: var(--wheat); }

/* ---------- stage ---------- */
.stage { --bs: min(calc(100vh - var(--bar) - 110px), 52vw, 640px); display: grid; grid-template-columns: var(--bs) minmax(300px, 460px); justify-content: center; align-items: center; gap: 34px; padding-block: 20px 22px; min-height: 0; position: relative; }
.board-col { width: var(--bs); display: flex; flex-direction: column; gap: 12px; }
.board-frame { width: 100%; aspect-ratio: 1; padding: 20px; position: relative; border-radius: 10px; box-shadow: var(--shadow), inset 0 0 0 2px rgba(255, 220, 160, .18), inset 0 -6px 12px rgba(0, 0, 0, .3);
  background:
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0) 0 18px, rgba(0, 0, 0, .07) 18px 19px, rgba(255, 255, 255, .03) 19px 37px, rgba(0, 0, 0, .05) 37px 38px),
    linear-gradient(160deg, var(--wood), var(--wood-2)); }
.board-frame .nail { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e8d9bd, #8a7454 60%, #4a3a26); box-shadow: 0 1px 1px rgba(0, 0, 0, .5); }
.board-frame .nail.a { left: 6px; top: 6px; } .board-frame .nail.b { right: 6px; top: 6px; } .board-frame .nail.c { left: 6px; bottom: 6px; } .board-frame .nail.d { right: 6px; bottom: 6px; }
.board { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); user-select: none; -webkit-user-select: none; touch-action: none; overflow: hidden; background: var(--sq-l); border-radius: 2px; box-shadow: 0 0 0 2px rgba(0, 0, 0, .25); }
.sq { position: relative; display: grid; place-items: center; }
.sq.l { background: var(--sq-l); }

.board.clicky .sq { cursor: pointer; }
.sq.last::before, .sq.sel::before, .sq.check::before, .sq[data-mark]:not([data-mark=""])::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(240, 193, 75, .42); }
.sq.sel::before { background: rgba(43, 120, 168, .38); }
.sq.check::before { background: radial-gradient(circle, rgba(214, 40, 30, .85), rgba(214, 40, 30, 0) 72%); }
.sq[data-mark="cannon"]::before { box-shadow: inset 0 0 0 4px var(--brick); background: var(--brick-soft); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="screen"]::before { box-shadow: inset 0 0 0 4px var(--sky); background: var(--sky-soft); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="target"]::before { box-shadow: inset 0 0 0 4px var(--wheat-hi); background: radial-gradient(circle, transparent 30%, rgba(240, 193, 75, .45) 31% 36%, transparent 37%), rgba(240, 193, 75, .25); animation: markin .4s cubic-bezier(.2, 1.5, .4, 1); }
.sq[data-mark="checker"]::before { box-shadow: inset 0 0 0 4px #d12a1e; background: rgba(209, 42, 30, .16); animation: pulse 1s ease-in-out infinite alternate; }
.sq[data-mark="miss"]::before { background: rgba(209, 42, 30, .3); }
.sq[data-mark="trail"]::before { background: radial-gradient(circle, rgba(180, 70, 43, .55) 0 16%, transparent 17%); }
@keyframes markin { from { transform: scale(1.5); opacity: 0; } }
@keyframes pulse { to { box-shadow: inset 0 0 0 7px #d12a1e; } }
.sq.dot::after { content: ""; position: absolute; width: 24%; height: 24%; border-radius: 50%; background: rgba(47, 33, 20, .38); pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid rgba(47, 33, 20, .38); pointer-events: none; }
.co { position: absolute; font-size: clamp(9px, 1.15vmin, 12px); line-height: 1; pointer-events: none; z-index: 1; font-weight: 800; }
.sq.l .co { color: #9a6c44; }
.sq.d .co { color: #f6e8c8; }
.co-r { top: 3px; left: 3px; }
.co-f { bottom: 2px; right: 3px; }
.pc { width: 90%; height: 90%; position: relative; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 1px rgba(40, 20, 5, .25)); }
.pc.anim { transition: transform .24s cubic-bezier(.3, .7, .4, 1); }
.pc.lift { opacity: .3; }
.pc.pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); }
.board .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.ov .beam { stroke: var(--wheat-hi); stroke-width: .13; stroke-linecap: round; filter: drop-shadow(0 0 .08px #fff); stroke-dasharray: .32 .16; animation: beamrun .6s linear infinite, beamin .35s ease-out; }
.ov .beam.k { stroke: #ff5a3c; }
.ov .beamglow { stroke: rgba(255, 236, 170, .55); stroke-width: .38; stroke-linecap: round; animation: beamin .35s ease-out; }
.ov .beamglow.k { stroke: rgba(255, 110, 80, .4); }

.promo { position: absolute; inset: 0; z-index: 5; background: rgba(47, 33, 20, .55); display: grid; place-items: center; }

/* flour puff and grain burst */
.puff { position: fixed; z-index: 85; pointer-events: none; width: 10px; height: 10px; translate: -50% -50%; }
.puff i { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff, rgba(255, 252, 240, .85) 45%, rgba(255, 248, 225, 0) 72%); animation: puff 1s ease-out forwards; animation-delay: var(--d); }
@keyframes puff { from { transform: translate(0, 0) scale(.2); opacity: .95; } to { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; } }
#grain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* the move plank under the board */
.plank { position: relative; height: 40px; margin-inline: 6px; border-radius: 6px; display: flex; align-items: center; overflow: hidden; padding-inline: 14px; font-size: 15px; font-weight: 700; color: #fbeccc; white-space: nowrap;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 9px, rgba(0, 0, 0, .08) 9px 10px), linear-gradient(var(--wood), var(--wood-2)); box-shadow: inset 0 0 10px rgba(0, 0, 0, .45), 0 6px 14px -10px rgba(0, 0, 0, .8); }

/* ---------- card: a linen flour sack ---------- */
.card { position: relative; color: var(--ink); padding: 30px 26px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; border-radius: 14px 14px 18px 18px; margin: 8px;
  background: repeating-linear-gradient(0deg, rgba(90, 60, 20, .035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(90, 60, 20, .03) 0 1px, transparent 1px 3px), var(--card);
  box-shadow: var(--shadow), 0 0 0 1px rgba(90, 60, 20, .2); outline: 2px dashed rgba(180, 70, 43, .32); outline-offset: -9px; }
.card::before { content: ""; position: absolute; left: 50%; top: -12px; width: 64px; height: 22px; translate: -50% 0; border-radius: 0 0 14px 14px; background: linear-gradient(#c79a55, #a7773a); box-shadow: 0 3px 6px -3px rgba(0, 0, 0, .5); }
.card::after { content: ""; position: absolute; left: 50%; top: -18px; width: 22px; height: 14px; translate: -50% 0; border: 3px solid #8a5b26; border-bottom: 0; border-radius: 12px 12px 0 0; }
.card > * { animation: rise .45s cubic-bezier(.2, .9, .3, 1) backwards; }
.card > :nth-child(2) { animation-delay: .05s; }
.card > :nth-child(3) { animation-delay: .1s; }
.card > :nth-child(4) { animation-delay: .15s; }
.card > :nth-child(n+5) { animation-delay: .2s; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.kicker { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.kicker b { color: var(--brick); font-weight: 800; }
.title { font-family: var(--f-head); font-weight: 800; font-size: clamp(30px, 2.8vw, 40px); line-height: 1.04; color: var(--brick-2); }
.task { font-size: 17px; line-height: 1.45; }
.task b { color: var(--brick-2); }
.note { border-left: 3px solid var(--wheat); padding: 2px 0 2px 12px; color: var(--muted); font-size: 16px; }
.note b { color: var(--ink); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); padding: 9px 17px; border-radius: 22px; cursor: pointer; font-weight: 800; font-size: 15px; line-height: 1.1; transition: background .15s, color .15s, transform .1s, box-shadow .15s; }
.btn:hover { background: var(--card-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--brick); border-color: var(--brick); color: #fff7e8; box-shadow: 0 6px 14px -8px rgba(143, 52, 32, .9); }
.btn.primary:hover { background: var(--brick-2); }
.btn.hint { border-style: dashed; color: var(--plum); border-color: var(--plum); }
.btn.big { padding: 13px 24px; font-size: 16px; }
.btn.armed { background: var(--brick); border-color: var(--brick); color: #fff; }
.fb { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card-2); border-radius: 10px; font-size: 16px; }
.fb:empty { background: transparent; min-height: 0; padding: 0; }
.fb[data-type="ok"] { background: var(--green-soft); }
.fb[data-type="bad"] { background: var(--brick-soft); }
.fb[data-type="warn"] { background: var(--plum-soft); }
.fb[data-type="info"] { background: var(--sky-soft); }
.fb-mark { flex: none; width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; font-weight: 800; border: 1.5px solid currentColor; border-radius: 50%; }
.fb[data-type="ok"] .fb-mark { color: var(--green); }
.fb[data-type="bad"] .fb-mark { color: var(--brick); }
.fb[data-type="warn"] .fb-mark { color: var(--plum); }
.fb[data-type="info"] .fb-mark { color: var(--sky); }
.fb b { color: var(--brick-2); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-2px); } 100% { transform: none; } }
.pips { display: flex; gap: 6px; }
.pips i { width: 11px; height: 15px; border-radius: 50%; background: var(--line-2); transform: rotate(20deg); }
.pips i.done { background: var(--wheat); }

/* fact card: a seed packet that flips */
.fact { perspective: 900px; }
.fact button { width: 100%; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
.fact .inner { position: relative; display: grid; transition: transform .6s cubic-bezier(.3, .8, .3, 1); transform-style: preserve-3d; }
.fact.open .inner { transform: rotateY(180deg); }
.fact .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; padding: 12px 14px; }
.fact .front { background: repeating-linear-gradient(-45deg, #c9921f 0 8px, #d9a42c 8px 16px); color: #3a2408; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 0 0 2px rgba(255, 246, 214, .6), inset 0 0 0 5px rgba(140, 90, 10, .4); min-height: 56px; }
.fact .front svg { width: 32px; height: 32px; flex: none; }
.fact .front b { font-family: var(--f-head); font-weight: 800; font-size: 19px; }
.fact .front span { font-size: 13px; opacity: .85; display: block; font-weight: 700; }
.fact .back { transform: rotateY(180deg); background: var(--card-2); border: 1.5px solid var(--wheat); font-size: 14px; line-height: 1.4; }

/* the program and the parts of an ambush */
.prog { display: flex; flex-wrap: wrap; gap: 5px; }
.prog span { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.prog span i { font-style: normal; color: var(--brick); margin-right: 4px; font-family: var(--f-head); }
.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.parts li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; font-size: 15px; padding: 6px 10px; border-radius: 10px; background: var(--card-2); transition: opacity .3s; }
.parts li.dim { opacity: .55; }
.parts li i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: #fff; font-size: 13px; }
.parts li.cannon i { background: var(--brick); }
.parts li.screen i { background: var(--sky); }
.parts li.target i { background: var(--wheat); }

/* three answers to a check */
.ways { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ways button { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--card); cursor: pointer; font-weight: 800; font-size: 15px; line-height: 1.15; transition: background .15s, border-color .15s, transform .1s; }
.ways button small { font-weight: 600; font-size: 12px; color: var(--muted); }
.ways button:hover { border-color: var(--brick); }
.ways button[aria-pressed="true"] { background: var(--wheat-soft); border-color: var(--wheat); box-shadow: inset 0 0 0 1.5px var(--wheat); }
.ways button.right { background: var(--green-soft); border-color: var(--green); }
.ways button.wrong { background: var(--brick-soft); border-color: var(--brick); }
.ways button.missed { border-style: dashed; border-color: var(--green); }
.ways button:disabled { cursor: default; }
.ways button .ic { font-size: 20px; line-height: 1; }

/* the flour sack meter */
.sack { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--card-2); }
.sack svg { width: 70px; height: 78px; overflow: visible; }
.sack .bag { fill: #e9d5a6; stroke: #8a5b26; stroke-width: 2; }
.sack .flour { fill: #fffdf6; transition: y .6s cubic-bezier(.2, 1.2, .4, 1), height .6s cubic-bezier(.2, 1.2, .4, 1); }
.sack .tie { fill: none; stroke: #8a5b26; stroke-width: 3; stroke-linecap: round; }
.sack .mark { fill: var(--brick); font-family: var(--f-head); font-weight: 800; font-size: 13px; }
.sack b { font-family: var(--f-head); font-weight: 800; font-size: 22px; color: var(--brick-2); display: block; line-height: 1.1; }
.sack .got { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.sack .got span { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line-2); animation: markin .35s cubic-bezier(.2, 1.5, .4, 1); }
.sack.bump svg { animation: sackbump .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes sackbump { 40% { transform: scale(1.12, .92); } }

/* finish: a small mill spinning fast */
.finale { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; }
.minimill { width: 92px; height: 110px; overflow: visible; }
.minimill .ms { transform-origin: 46px 34px; animation: spinsail 1.6s linear infinite; }
.starrow { display: flex; gap: 8px; }
.starrow svg { width: 44px; height: 44px; color: var(--wheat-hi); filter: drop-shadow(0 2px 1px rgba(120, 70, 0, .45)); animation: starin .5s cubic-bezier(.2, 1.5, .5, 1) backwards; }
.starrow svg:nth-child(2) { animation-delay: .14s; }
.starrow svg:nth-child(3) { animation-delay: .28s; }
.starrow svg.off { color: var(--line-2); filter: none; }
@keyframes starin { from { transform: scale(.2) rotate(-120deg); opacity: 0; } }

/* stamp on the board */
.seal { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 6; pointer-events: none; font-family: var(--f-head); font-weight: 800; font-size: clamp(26px, 4.6vw, 54px); letter-spacing: .03em; text-transform: uppercase; color: var(--brick); padding: 10px 26px 8px; white-space: nowrap; border-radius: 10px; rotate: -7deg;

.seal.blue { color: var(--sky); border-color: var(--sky); }
.seal.green { color: var(--green); border-color: var(--green); }

.links { display: grid; gap: 6px; }

.recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 15px; }
.recap li { display: grid; grid-template-columns: 28px 1fr; gap: 6px; align-items: start; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); z-index: 95; background: var(--card); color: var(--ink); border-left: 3px solid var(--wheat); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px; overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; font-size: 16px; }

.drawer .close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; color: var(--ink); border-color: var(--line-2); background: transparent; }
.drawer .plan { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line-2); font-size: 14px; color: var(--muted); }
.drawer .plan b { color: var(--ink); }

    if (opts.onPly) opts.onPly(k, r.san);
    later(step, opts.delay || 800);
  };
  later(step, opts.first || 450);
}

/* ---------- verified move-graph player: the student moves, the computer replies ---------- */
function makeGraph(o) {
  // o: { task:{fen, side, G}, onDone(kind, stats), onStep(k, san, pos), onReply(k, san, pos), badText(san, refSan, u), eqText(san), wText(san), showRef: 'play' | 'arrow', limitSeal }
  const T = o.task, G = T.G;
  let pos, sans, busy, over, gen = 0, k; let mistakes = 0, hints = 0;
  const showTape = () => tape(sans, T.fen);
  function reset() {
    gen++; demoGen++;
    pos = new Position(T.fen); sans = []; busy = false; over = false; k = 0; BEAMS = [];
    board.setOrient(T.side); board.set(pos); board.arrows = []; board.render(); showTape(); clearSeal();
    if (o.onReset) o.onReset(pos);
  }
  reset();
  function done(kind) {
    over = true;
    if (kind === 'mate') seal('Мат!', '', o.mateSmall || 'жернова смололи');
    else if (o.limitSeal) seal(o.limitSeal[0], o.limitSeal[1] || 'green', o.limitSeal[2]);
    flash($('#frame'), 'ok'); Sound.harvest(); Wind.gust(2); Grain.burst(0.35);
    o.onDone(kind, { mistakes, hints, sans });
  }
  board.canMove = () => !busy && !over && pos.turn === T.side;
  board.onMove = mv => {
    const prev = pos.fen(), key = keyOf(pos), nd = G[key];
    const r = board.play(mv); if (!r) return;
    const u = uciOf(r.m);
    if (nd && u in nd.g) {
      sans.push(r.san); showTape(); board.arrows = []; board.marks = {}; board.render(); Sound.ok(); Wind.gust(0.8); k++;
      if (o.onStep) o.onStep(k, r.san, pos);
      const st = pos.status();
      if (st === 'mate' || st === 'stalemate') { done(st); return; }
      const rep = nd.g[u];
      if (!rep) { done('limit'); return; }
      busy = true; const g0 = gen;
      later(() => {
        if (g0 !== gen) return;
        const rr = board.play(sqFromU(rep)); sans.push(rr.san); showTape(); busy = false;
        if (o.onReply) o.onReply(k, rr.san, pos);
        const st2 = pos.status();
        if (st2 === 'mate' || st2 === 'stalemate') { done(st2); return; }
        if (!G[keyOf(pos)]) done('limit');
      }, 760);
      return;
    }
    busy = true; const g1 = gen;
    const back = ms => later(() => { if (g1 !== gen) return; pos = new Position(prev); BEAMS = []; board.set(pos); board.arrows = []; board.marks = {}; board.render(); clearSeal(); busy = false; }, ms);
    if (nd && nd.e.includes(u)) { Sound.tick(); say('warn', o.eqText ? o.eqText(r.san) : `${RUP(r.san)} — тоже неплохо, но ищем другой ход.`); back(1800); return; }
    if (nd && nd.w && nd.w.includes(u)) { Sound.tick(); say('warn', o.wText ? o.wText(r.san) : `${RUP(r.san)} — сильный ход, но есть ещё сильнее. Ищите!`); back(1800); return; }
    mistakes++; Sound.bad(); flash($('#frame'), 'bad');
    const ref = nd && nd.b[u]; let refSan = '';
    if (ref) {
      const m2 = pos.findMove(sqFromU(ref));
      if (m2) {
        refSan = pos.san(m2);
        if (o.showRef === 'play') later(() => { if (g1 === gen && !over) board.play(sqFromU(ref)); }, 700);
        else { board.arrows = [{ from: m2.from, to: m2.to, color: 'var(--brick)' }]; board.render(); }
      }
    }
    say('bad', o.badText ? o.badText(r.san, refSan, u) : `${RUP(r.san)}? ${refSan ? `Ответ <b>${RUP(refSan)}</b> — и замысел рушится.` : 'Так не выйдет.'}`);
    back(o.showRef === 'play' ? 2900 : 2100);
  };
  return {
    reset,
    hint() {
      if (busy || over) return false; const nd = G[keyOf(pos)]; if (!nd) return false;
      const u = o.hintMove ? o.hintMove(nd, pos) : Object.keys(nd.g)[0]; if (!u) return false;
      hints++; board.arrows = [{ from: sqIndex(u.slice(0, 2)), to: sqIndex(u.slice(2, 4)), color: 'var(--plum)' }]; board.render(); Sound.reveal(); return true;
    },
    stats: () => ({ mistakes, hints }),
    pos: () => pos
  };
}

/* shared: a chapter of rounds; a round is a graph task or a custom game (r.custom) */
function roundsChapter(ch, rounds, cfg) {
  let i, res, errs, L;
  function next() {
    const last = i === rounds.length - 1;
    ctl(Bt('nx', last ? 'Итог главы →' : 'Следующая задача →', 'primary'));
    on('nx', () => { clearSeal(); if (last) finish(); else { i++; show(); } });
  }
  function show() {
    const r = rounds[i];
    if (r.custom) {
      r.custom({ kicker: cfg.kicker, pips: () => pips(rounds.length, i, res), finish(e) { errs += e; res[i] = e === 0; const kb = card.querySelector('.kicker b'); if (kb) kb.innerHTML = pips(rounds.length, i, res); next(); } });
      return;
    }
    card.innerHTML = head(cfg.kicker, pips(rounds.length, i, res), r.title, r.text) +
      (r.extra || '') + `<div class="fb" id="fb"></div><div class="controls" id="ctl"></div>` + (r.fact ? factHtml(r.fact[0], r.fact[1], r.fact[2]) : '');
    ctl(Bt('hintB', 'Подсказка', 'hint') + Bt('rsB', 'Заново'));
    on('hintB', () => { if (L.hint()) say('warn', cfg.hintText || 'Стрелка показывает нужный ход.'); });
    on('rsB', () => { L.reset(); say(); if (r.onReset) r.onReset(); });
    if (r.onShow) r.onShow();
    L = makeGraph(Object.assign({ showRef: cfg.showRef, eqText: cfg.eqText, wText: cfg.wText, badText: cfg.badText }, r.opts || {}, {
      task: r.task,
      onStep(k, san, pos) { const t = r.steps && r.steps[k - 1]; if (t) say('ok', typeof t === 'function' ? t(san) : t); else say(); if (r.onStep) r.onStep(k, san, pos); },
      onReply(k, san, pos) { if (r.onReply) r.onReply(k, san, pos); },
      onDone(kind, st) {
        const e = st.mistakes + st.hints; errs += e; res[i] = e === 0;
        card.querySelector('.kicker b').innerHTML = pips(rounds.length, i, res);
        if (r.onDoneHook) r.onDoneHook(kind, st);
        const d = r.done || {};
        say('ok', typeof d === 'function' ? d(kind, st) : (d[kind] || d.any || 'Готово!'));
        next();
      }
    }));
  }
  function finish() { card.innerHTML = head(cfg.kicker, '', cfg.doneTitle, '') + finishCard(ch, scoreBy(errs), cfg.doneLine); }
  return { enter() { i = 0; res = []; errs = 0; if (cfg.before) cfg.before(e => { errs = e; show(); }); else show(); } };
}

      `<div class="fb" id="fb"></div><div class="controls" id="ctl"></div>` +
      factHtml('Охотничий факт', 'мат был ещё быстрее', 'После 15…Крf3 мат в 2 хода давали 16.Крf1! или 16.0-0! Но путь Ласкера красивее: чёрный король прошёл через всю доску — от g8 до g1.') +
      factHtml('Кто играл', 'однофамилец чемпиона', 'Эдвард Ласкер — инженер и сильный мастер, дальний родственник Эмануила Ласкера. Его соперник сэр Джордж Томас был чемпионом Британии по шахматам и знаменитым игроком в бадминтон.');
    ctl(Bt('hintB', 'Подсказка', 'hint') + Bt('rsB', 'Заново'));
    on('hintB', () => { if (L.hint()) say('warn', 'Стрелка показывает ход Ласкера.'); });
    on('rsB', () => { L.reset(); say(); });
    L = makeGraph({ task: D.g.h1, mateSmall: 'король дошёл до g1',
      eqText: san => `${RUP(san)} — тоже ведёт к мату! Но Эдвард Ласкер сыграл иначе — найдите его ход.`,
      wText: san => `${RUP(san)} — сильно, но здесь есть форсированный мат. Только шахи!`,
      onReset(pos) { TRAIL = [pos.kingSq('b')]; tape(D.lasker.moves.slice(D.lasker.from - 6, D.lasker.from), fenAfter(D.start, D.lasker.moves.slice(0, D.lasker.from - 6))); },
      onStep(k, san, pos) { say('ok', STEPS[k - 1] || ''); trail(pos); },
      onReply(k, san, pos) { trail(pos); },
      onDone(kind, st) {
        errs = st.mistakes + st.hints; trail(L.pos());
        const last = st.sans[st.sans.length - 1] || '';
        say('ok', last.startsWith('O-O-O') ? 'Мат рокировкой! В партии Ласкер сыграл 18.Крd2# — король открыл линию ладье a1, тоже мат.' : 'Крd2#! Король ушёл и открыл линию ладье a1 — мат <b>вскрытым шахом</b>. Чёрный король прошёл от g8 до g1!');
        ctl(Bt('nx', 'Итог главы →', 'primary')); on('nx', finish);
      }
    });
  }
  function finish() { clearSeal(); card.innerHTML = head('Глава 7 · Лондон, 1912', '', 'Охота окончена', '') + finishCard(7, scoreBy(errs), 'Жертва ферзя, двойной шах — и мат вскрытым шахом. Красный след — путь чёрного короля через всю доску.', 'К итогам →'); }
  return { enter() { show(); }, leave() { TRAIL = null; } };
})();

/* ★ — the flour sack: summary */
IMPL[8] = (() => {
  const RANKS = [[19, 'Хозяин мельницы'], [14, 'Мельник'], [8, 'Подмастерье'], [0, 'Ученик мельника']];
  const DESC = { 'Хозяин мельницы': 'жернова слушаются с полуслова', 'Мельник': 'мелет без холостых оборотов', 'Подмастерье': 'засаду видит издалека', 'Ученик мельника': 'всё ещё впереди' };
  return {
    enter() {
      const n = totalS(), rank = RANKS.find(r => n >= r[0])[1];
      const p = new Position(D.mill.fen); board.set(p);
      BEAMS = [{ from: sqIndex('f6'), to: sqIndex('h8'), k: false }]; board.render();
      card.innerHTML = head('Мешок муки', `${n} из ${MAXS}`, rank, `${DESC[rank][0].toUpperCase() + DESC[rank].slice(1)}.`) +
        `<div class="finale">${MINIMILL}<div class="starrow">${[0, 1, 2].map(k => starSvg(k < Math.round(n / MAXS * 3) ? '' : 'off')).join('')}</div></div>
        <ul class="recap">
          <li><i>⌖</i><span><b>Засада</b> — пушка, ширма и мишень. Ширма уходит с угрозой.</span></li>
          <li><i>+</i><span><b>Открытый шах</b> — ширма ходит куда угодно, даже на ферзя.</span></li>
          <li><i>✕</i><span><b>Двойной шах</b> — закрыться и взять нельзя, только уйти королём.</span></li>
          <li><i>✤</i><span><b>Мельница</b> — открытый шах, шах, открытый шах… и каждый оборот с добычей.</span></li>
          <li><i>⛨</i><span><b>Защита</b> — уберите мишень или закройте линию заранее.</span></li>
        </ul>
        <p class="kicker"><span>Домашнее задание</span></p>
        <div class="links">
          <a href="https://lichess.org/training/discoveredAttack" target="_blank" rel="noopener">Задачи «Вскрытое нападение» на Lichess <span>решите 10 задач: засады и открытые шахи</span></a>
          <a href="https://lichess.org/training/doubleCheck" target="_blank" rel="noopener">Задачи «Двойной шах» на Lichess <span>решите 5 задач</span></a>
          <button type="button" id="pgnB">Скачать PGN урока <span>Lichess → Исследование → Импорт PGN</span></button>
          <button type="button" id="pgnC">Скопировать PGN <span>и вставить в Lichess</span></button>
        </div>
        <div class="fb" id="fb"></div>
        <div class="controls"><button type="button" class="btn" id="resetAll">Сбросить звёзды</button></div>`;
      Sound.harvest(); later(() => Grain.burst(1.2), 400); Wind.gust(4);
      const PGN = window.MELNICA_PGN, FILE = 'melnitsa-torre-lichess';
      const blobSave = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([PGN], { type: 'application/x-chess-pgn' })); a.download = FILE + '.pgn'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) { say('warn', 'Скачивание недоступно — скопируйте PGN кнопкой ниже.'); } };
      on('pgnB', async () => {
        if (window.Academy && Academy.on) { Academy.download(FILE + '.txt', PGN); say('ok', 'Академия предложит сохранить файл. В Lichess: Исследование → Импорт PGN.'); return; }
        const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (!dl) { blobSave(); return; }
        try { await dl.save({ filename: FILE + '.txt', data: PGN }); say('ok', 'Файл сохранён. В Lichess: Исследование → Импорт PGN → вставьте текст из файла.'); }
        catch (e) { if (e && e.code === 'declined') say(); else say('warn', 'Скачивание недоступно здесь — скопируйте PGN кнопкой ниже.'); }
      });
      on('pgnC', async () => {
        try { await navigator.clipboard.writeText(PGN); say('ok', 'PGN скопирован. В Lichess: Исследование → Импорт PGN → вставьте.'); }
        catch (e) { say('warn', 'Браузер не дал скопировать. Используйте кнопку «Скачать PGN».'); }
      });
      twoStep($('#resetAll'), 'Точно сбросить?', () => { state = { v: 1, ch: 8, st: {} }; save(); go(8); });
    }
  };
})();

/* ---------- start ---------- */
renderTabs();
go(Math.min(CH.length - 1, Math.max(0, state.ch || 0)));
(function intro() {
  const c = $('#intro'); if (!c) return;
  if (reduceMotion) { c.classList.add('gone'); return; }
  setTimeout(() => { c.classList.add('open'); Sound.gust(); Wind.gust(5); }, 1200);
  setTimeout(() => c.classList.add('gone'), 2100);
})();
})();
</script>
