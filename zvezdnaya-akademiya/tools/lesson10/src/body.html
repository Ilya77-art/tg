<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>
<div class="sky" aria-hidden="true">
  <div class="stars-sky"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none">
    <path class="h1" d="M0 120 Q160 60 340 110 T720 96 T1200 70 V300 H0Z"/>
    <path class="h2" d="M0 170 Q260 110 560 160 T1200 140 V300 H0Z"/>
    <path class="rows" d="M0 196 Q300 150 620 190 T1200 176M0 222 Q300 184 640 216 T1200 206M0 250 Q300 220 660 246 T1200 238M0 278 Q300 254 680 276 T1200 270"/>

    <path class="body" d="M62 292 L76 112 H124 L138 292 Z"/>

    <path class="door" d="M90 292 V262 Q100 250 110 262 V292 Z"/>

    <circle class="hub" cx="100" cy="96" r="6"/>

</div>
<div id="app">
  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M17 46 L20 22 H28 L31 46 Z" style="fill:var(--mill-body);stroke:var(--mill-frame)" stroke-width="1.4"/>
        <path d="M18.5 23 Q19 15 24 14 Q29 15 29.5 23 Z" style="fill:var(--mill-roof);stroke:var(--mill-frame)" stroke-width="1.4"/>
        <path d="M22 46 V40 Q24 37.6 26 40 V46 Z" style="fill:var(--mill-frame)"/>
        <g class="ls" style="stroke:var(--mill-frame);fill:var(--mill-sail)" stroke-width="1.2">
          <path d="M24 17 L24 1 M24 17 L40 17 M24 17 L24 33 M24 17 L8 17"/>
          <rect x="25" y="3" width="5" height="11" rx=".8"/><rect x="27" y="18" width="11" height="5" rx=".8"/>
          <rect x="18" y="20" width="5" height="11" rx=".8"/><rect x="10" y="11" width="11" height="5" rx=".8"/>
        </g>
        <circle cx="24" cy="17" r="2.2" style="fill:var(--mill-frame)"/>
      </svg>
      <div><b>Мельница Торре</b><span>вскрытые удары</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Главы урока"></nav>
    <div class="tools">
      <span class="stars" id="stars" aria-live="polite"></span>
      <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Звук" title="Звук"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button type="button" class="icon-btn" id="notesBtn" aria-label="Заметки ведущему" title="Заметки ведущему"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 11h7M9 15h7M9 7h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <main class="stage">
    <div class="board-col">
      <div class="board-frame" id="frame"><i class="nail a"></i><i class="nail b"></i><i class="nail c"></i><i class="nail d"></i><div class="board" id="board"></div></div>
      <div class="plank" aria-label="Ходы"><span class="lead">ходы</span><span class="tm" id="tapeMoves"></span></div>
    </div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>
<aside class="drawer" id="drawer" aria-label="Заметки ведущему">
  <button type="button" class="icon-btn close" id="drawerClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <h3>Ведущему</h3>
  <div id="notes"></div>
</aside>
<div class="intro" id="intro" aria-hidden="true">
  <svg viewBox="-100 -100 200 200" style="--mill-sail:#fffaf0;--mill-frame:#5b3a22"><use href="#sails4"/><circle r="5" fill="#5b3a22"/></svg>
  <div class="bill"><small>шахматный помол</small>Мельница Торре</div>
</div>
<canvas id="grain" aria-hidden="true"></canvas>
